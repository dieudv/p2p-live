<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P2P11</title>
<meta name="description" content="Direct 1-to-1 peer-to-peer video calls in the browser.">
<meta name="theme-color" content="#0e7c86">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="P2P11">
<style>
  :root {
    --bg: #e8edf1; --ink: #14212b; --muted: #5b6b78; --panel: #ffffff;
    --accent: #0e7c86; --accent-ink: #ffffff; --danger: #c2412d; --stage: #101a22;
    --line: #cfd8df;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1419; --ink: #e6edf2; --muted: #8fa1ae; --panel: #16212a; --line: #26343f; --stage: #05090c; --accent: #2bb3bf; --accent-ink: #04161a; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, input { font: inherit; color: inherit; }
  .lobby { min-height: 100%; display: grid; grid-template-rows: 1fr auto; place-items: center; padding: 24px; position: relative; }
  .btn.ghost { margin-top: 14px; background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .hint { margin: 14px 0 0; color: var(--muted); font-size: .88rem; }
  .foot { margin-top: 24px; font-size: .85rem; color: var(--muted); text-align: center; }
  .foot a { color: inherit; text-decoration: underline; text-underline-offset: 3px; }
  .foot a:hover { color: var(--ink); }
  .foot a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 28px; width: min(420px, 100%); }
  h1 { margin: 0 0 6px; font-size: 1.6rem; letter-spacing: -0.01em; }
  p.sub { margin: 0 0 22px; color: var(--muted); }
  .btn { border: 0; border-radius: 10px; padding: 12px 18px; cursor: pointer; background: var(--accent); color: var(--accent-ink); font-weight: 600; width: 100%; }
  .btn:focus-visible, .ctl:focus-visible, .lang:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .or { text-align: center; color: var(--muted); margin: 16px 0; font-size: .9rem; }
  .row { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: transparent; }
  .row .btn { width: auto; background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .err { color: var(--danger); margin: 14px 0 0; min-height: 1.4em; font-size: .92rem; }
  .lang { position: absolute; top: 16px; right: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: .9rem; }

  .call { display: none; position: fixed; inset: 0; background: var(--stage); }
  .call.on { display: block; }
  #remote { width: 100%; height: 100%; object-fit: contain; background: var(--stage); }
  #local { position: absolute; right: 16px; bottom: var(--lb); width: var(--lw); height: auto; max-height: 40vh; object-fit: contain; border-radius: 12px; border: 2px solid rgba(255,255,255,.25); background: #000; }
  .status { position: absolute; top: 16px; left: 16px; right: 16px; display: flex; gap: 10px; align-items: center; justify-content: space-between; color: #fff; }
  .pill { background: rgba(0,0,0,.55); padding: 8px 14px; border-radius: 999px; font-size: .92rem; }
  .pill button { background: none; border: 0; color: #fff; text-decoration: underline; cursor: pointer; padding: 0 0 0 8px; }
  .bar { position: absolute; left: 0; right: 0; bottom: 20px; display: flex; justify-content: center; gap: 12px; }
  .ctl { border: 0; border-radius: 999px; padding: 12px 20px; background: rgba(255,255,255,.14); color: #fff; cursor: pointer; font-weight: 600; }
  .ctl[aria-pressed="true"] { background: #fff; color: #111; }
  .ctl.hang { background: var(--danger); }
  .bar { flex-wrap: wrap; gap: 8px; padding: 0 12px; }
  .ctl { padding: 10px 16px; }
  .ctl[aria-expanded="true"] { background: #fff; color: #111; }
  .panel { display: none; position: absolute; left: 16px; bottom: 84px; z-index: 5; width: min(360px, calc(100% - 32px)); max-height: calc(100% - 160px); overflow: auto; background: rgba(16,26,34,.94); color: #fff; border: 1px solid rgba(255,255,255,.18); border-radius: 12px; padding: 16px; }
  .panel.on { display: block; }
  .panel h2 { margin: 0 0 12px; font-size: 1rem; }
  .panel label { display: block; margin-bottom: 12px; font-size: .88rem; color: #b9c6d0; }
  .panel select { display: block; width: 100%; margin-top: 4px; padding: 9px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,.25); background: #0b1217; color: #fff; font: inherit; }
  .panel select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .panel .err { color: #ff9b8a; margin: 0; min-height: 0; }
  .panel dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; font-size: .9rem; }
  .panel dt { color: #b9c6d0; }
  .panel dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  .panel p { margin: 0; color: #b9c6d0; font-size: .9rem; }
  .ctl { width: 48px; height: 48px; padding: 0; display: inline-grid; place-items: center; }
  .ctl svg { width: 22px; height: 22px; display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .pill button { display: inline-flex; vertical-align: middle; align-items: center; }
  .pill button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .call.mirror #local, .call.mirror #remote { transform: scaleX(-1); }
  .call.mirror.in-pip #remote { transform: none; }
  .call.mirror.remote-share #remote { transform: none; }
  .call.sharing #local { transform: none; }
  .status { flex-wrap: wrap; }
  #timer { font-variant-numeric: tabular-nums; }
  .panel label.check { display: flex; align-items: center; gap: 10px; color: #fff; }
  .panel input[type="checkbox"] { flex: none; width: 18px; height: 18px; margin: 0; padding: 0; accent-color: var(--accent); }
  .ctl { position: relative; }
  .badge { position: absolute; top: -2px; right: -2px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--danger); color: #fff; font-size: .72rem; line-height: 18px; font-weight: 700; text-align: center; }
  .msgs { display: flex; flex-direction: column; gap: 6px; max-height: min(32vh, 260px); overflow-y: auto; margin-bottom: 10px; }
  .msg { max-width: 85%; padding: 7px 11px; border-radius: 12px; font-size: .92rem; line-height: 1.35; overflow-wrap: anywhere; white-space: pre-wrap; }
  .msg.mine { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; }
  .msg.theirs { align-self: flex-start; background: rgba(255,255,255,.14); color: #fff; border-bottom-left-radius: 4px; }
  .msg.sys { align-self: center; background: none; color: #b9c6d0; font-size: .8rem; max-width: 100%; }
  .msg time { display: block; font-size: .7rem; opacity: .7; margin-top: 2px; }
  .chatrow { display: flex; gap: 8px; }
  .chatrow input { color: #fff; border-color: rgba(255,255,255,.25); }
  .chatrow input:disabled, .send:disabled { opacity: .45; cursor: not-allowed; }
  .send { flex: none; width: 44px; height: 44px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); cursor: pointer; display: grid; place-items: center; }
  .send svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .send:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  #mic::after { content: ''; position: absolute; left: 12px; right: 12px; bottom: 6px; height: 3px; border-radius: 2px; background: #4ade80; transform: scaleX(var(--lvl, 0)); transform-origin: left center; transition: transform .08s linear; }
  #mic[aria-pressed="true"]::after { display: none; }
  .call { --lw: min(28vw, 220px); --lb: 92px; } /* local video width and bottom offset, shared with the badges */
  .vu { position: absolute; z-index: 2; width: 28px; height: 28px; border-radius: 50%; background: #0e7c86; box-shadow: 0 0 0 2px rgba(255,255,255,.85); display: flex; align-items: center; justify-content: center; gap: 2px; opacity: 0; transform: scale(.8); transition: opacity .15s, transform .15s; pointer-events: none; }
  .vu.on { opacity: 1; transform: none; }
  .vu i { display: block; width: 3px; height: 4px; border-radius: 2px; background: #fff; transition: height .1s linear; }
  #vuRemote { left: 16px; bottom: var(--lb); }
  #vuLocal { right: calc(var(--lw) - 20px); bottom: calc(var(--lb) + 8px); }
  @media (prefers-reduced-motion: reduce) { #mic::after, .vu, .vu i { transition: none; } }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .hand { position: absolute; z-index: 2; width: 28px; height: 28px; border-radius: 50%; background: #f5b301; box-shadow: 0 0 0 2px rgba(255,255,255,.85); display: grid; place-items: center; font-size: 15px; line-height: 1; opacity: 0; transform: scale(.8); transition: opacity .15s, transform .15s; pointer-events: none; }
  .hand.on { opacity: 1; transform: none; }
  #handRemote { left: 50px; bottom: var(--lb); }
  #handLocal { right: calc(var(--lw) - 54px); bottom: calc(var(--lb) + 8px); }
  .badge.emo-dot { background: transparent; font-size: .95rem; line-height: 18px; min-width: 0; padding: 0; }
  .emojis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 12px; }
  .emo { font-size: 1.5rem; line-height: 1.2; padding: 6px 0; border-radius: 10px; border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.08); cursor: pointer; }
  .emo:hover { background: rgba(255,255,255,.18); }
  .emo:focus-visible, .handbtn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .emo:disabled, .handbtn:disabled { opacity: .4; cursor: not-allowed; }
  .handbtn { width: 100%; padding: 10px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,.25); background: transparent; color: #fff; cursor: pointer; font-weight: 600; display: flex; gap: 8px; align-items: center; justify-content: center; }
  .handbtn[aria-pressed="true"] { background: #f5b301; border-color: #f5b301; color: #1a1300; }
  .fly { position: absolute; z-index: 3; bottom: var(--lb); font-size: 2rem; line-height: 1; pointer-events: none; animation: floatUp 2.4s ease-out forwards; }
  .fly.theirs { left: calc(80px + var(--off, 0px)); }
  .fly.mine { right: calc(var(--lw) + 32px + var(--off, 0px)); }
  @keyframes floatUp {
    0% { opacity: 0; transform: translate(var(--dx, 0), 0) scale(.6); }
    15% { opacity: 1; transform: translate(var(--dx, 0), -20px) scale(1); }
    100% { opacity: 0; transform: translate(var(--dx, 0), -45vh) scale(1); }
  }
  @keyframes fadeOnly { 0% { opacity: 0; } 10% { opacity: 1; } 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .fly { animation: fadeOnly 1.8s forwards; } .hand { transition: none; } }
  .badge.dot { min-width: 10px; width: 10px; height: 10px; padding: 0; top: 2px; right: 2px; background: #ef4444; box-shadow: 0 0 0 2px rgba(16,26,34,.9); }
  .more-wrap { position: relative; }
  .menu { display: none; position: absolute; right: 0; bottom: calc(100% + 10px); z-index: 6; width: min(250px, 90vw); padding: 6px; flex-direction: column; gap: 2px; background: rgba(16,26,34,.96); border: 1px solid rgba(255,255,255,.18); border-radius: 12px; }
  .menu.on { display: flex; }
  .menu .ctl { display: flex; align-items: center; justify-content: flex-start; gap: 12px; width: 100%; height: auto; padding: 10px 12px; border-radius: 8px; background: transparent; color: #fff; font-weight: 500; font-size: .95rem; text-align: left; }
  .menu .ctl:hover { background: rgba(255,255,255,.12); }
  .menu .ctl[aria-pressed="true"], .menu .ctl[aria-expanded="true"] { background: rgba(255,255,255,.2); color: #fff; }
  .menu .ctl svg { flex: none; }
  .ctl:disabled { opacity: .4; cursor: not-allowed; }
  @media (max-width: 600px) { .call { --lw: 32vw; } }
  @media (max-width: 359px) { .call { --lb: 144px; } .panel { bottom: 144px; } }
</style>
</head>
<body>

<main class="lobby" id="lobby">
  <button class="lang" id="lang" type="button" aria-label="Language / Ngôn ngữ"></button>
  <div class="card">
    <h1>P2P11</h1>
    <p class="sub" data-i18n="sub"></p>
    <button class="btn" id="create" data-i18n="create"></button>
    <div class="or" data-i18n="or"></div>
    <div class="row">
      <input id="code" autocomplete="off" maxlength="32" data-i18n-ph="codePh" data-i18n-aria="codePh">
      <button class="btn" id="join" data-i18n="join"></button>
    </div>
    <p class="err" id="err" role="alert"></p>
    <button class="btn ghost" id="installBtn" hidden data-i18n="install"></button>
    <p class="hint" id="iosHint" hidden data-i18n="iosHint"></p>
  </div>
  <footer class="foot">
    <span data-i18n="footerOss"></span>
    <a href="https://github.com/dieudv/p2p11" target="_blank" rel="noopener noreferrer">github.com/dieudv/p2p11</a>
  </footer>
</main>

<section class="call mirror" id="call">
  <video id="remote" autoplay playsinline></video>
  <video id="local" autoplay playsinline muted></video>
  <div class="vu" id="vuRemote" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="vu" id="vuLocal" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="hand" id="handRemote" aria-hidden="true">✋</div>
  <div class="hand" id="handLocal" aria-hidden="true">✋</div>
  <div class="sr-only" id="live" role="status" aria-live="polite"></div>
  <div class="status">
    <span class="pill" id="status"></span>
    <span class="pill" id="timer" role="timer" data-i18n-label="timerLbl" hidden>00:00</span>
    <span class="pill"><span data-i18n="room"></span> <b id="roomName"></b><button id="copy"></button><button id="shareLinkBtn" data-i18n-label="shareLink"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg></button></span>
  </div>
  <div class="panel" id="devPanel" role="dialog" aria-labelledby="devTitle">
    <h2 id="devTitle" data-i18n="devices"></h2>
    <label><span data-i18n="lblCam"></span><select id="selCam"></select></label>
    <label><span data-i18n="lblMic"></span><select id="selMic"></select></label>
    <label id="spkRow"><span data-i18n="lblSpk"></span><select id="selSpk"></select></label>
    <label class="check"><input type="checkbox" id="soundChk"><span data-i18n="lblSound"></span></label>
    <label class="check"><input type="checkbox" id="mirrorChk"><span data-i18n="lblMirror"></span></label>
    <p class="err" id="devErr" role="alert"></p>
  </div>
  <div class="panel" id="chatPanel" role="dialog" aria-labelledby="chatTitle">
    <h2 id="chatTitle" data-i18n="chat"></h2>
    <div class="msgs" id="msgs" role="log" aria-live="polite"></div>
    <div class="chatrow">
      <input id="chatInput" maxlength="1000" autocomplete="off" disabled data-i18n-ph="chatPh" data-i18n-aria="chatPh">
      <button class="send" id="chatSend" disabled data-i18n-label="send"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>
    </div>
  </div>
  <div class="panel" id="reactPanel" role="dialog" aria-labelledby="reactTitle">
    <h2 id="reactTitle" data-i18n="react"></h2>
    <div class="emojis" id="emojis"></div>
    <button class="handbtn" id="handBtn" type="button" aria-pressed="false" disabled><span aria-hidden="true">✋</span><span id="handLabel"></span></button>
  </div>
  <div class="panel" id="infoPanel" role="dialog" aria-labelledby="infoTitle">
    <h2 id="infoTitle" data-i18n="infoTitle"></h2>
    <div id="infoBody"></div>
  </div>
  <div class="bar">
    <button class="ctl" id="mic" aria-pressed="false"></button>
    <button class="ctl" id="cam" aria-pressed="false"></button>
    <button class="ctl" id="chatBtn" aria-expanded="false" aria-controls="chatPanel" data-i18n-label="chat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span class="badge" id="chatBadge" hidden></span></button>
    <button class="ctl" id="reactBtn" aria-expanded="false" aria-controls="reactPanel" data-i18n-label="react"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><path d="M9 9h.01M15 9h.01"/></svg><span class="badge emo-dot" id="handDot" hidden>✋</span></button>
    <div class="more-wrap">
      <button class="ctl" id="moreBtn" aria-haspopup="true" aria-expanded="false" aria-controls="moreMenu" data-i18n-label="more"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg><span class="badge dot" id="moreDot" hidden></span></button>
      <div class="menu" id="moreMenu" role="group" data-i18n-aria="more">
        <button class="ctl" id="shareBtn" aria-pressed="false" disabled></button>
        <button class="ctl" id="pipBtn" aria-pressed="false" disabled></button>
        <button class="ctl" id="fsBtn" aria-pressed="false"></button>
        <button class="ctl" id="devBtn" aria-expanded="false" aria-controls="devPanel"><svg viewBox="0 0 24 24" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="9" cy="7" r="2.2"/><circle cx="15" cy="17" r="2.2"/></svg><span data-i18n="devices"></span></button>
        <button class="ctl" id="infoBtn" aria-expanded="false" aria-controls="infoPanel"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16"/><path d="M12 8h.01"/></svg><span data-i18n="info"></span></button>
      </div>
    </div>
    <button class="ctl hang" id="hang" data-i18n-label="hang"><svg viewBox="0 0 24 24" aria-hidden="true" style="transform:rotate(135deg)"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg></button>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);

  // ---------- i18n ----------
  const STR = {

      create: 'Tạo phòng mới', or: 'hoặc nhập mã phòng', codePh: 'Mã phòng', join: 'Vào phòng',
      room: 'Phòng', copy: 'Sao chép link', copied: 'Đã sao chép', copyPrompt: 'Sao chép link này:',
      micOn: 'Tắt mic', micOff: 'Bật mic', camOn: 'Tắt camera', camOff: 'Bật camera', hang: 'Kết thúc',
      switchTo: 'English',
      more: 'Thêm', sharingNow: 'đang chia sẻ màn hình',
      react: 'Biểu tượng cảm xúc', handRaise: 'Giơ tay', handLower: 'Hạ tay', remoteHandUp: 'Người kia đã giơ tay', remoteHandDown: 'Người kia đã hạ tay',
      install: 'Cài đặt như ứng dụng', iosHint: 'Để cài trên iPhone/iPad: mở bằng Safari, bấm nút Chia sẻ rồi chọn “Thêm vào MH chính”.',
      shareLink: 'Chia sẻ link phòng', shareText: 'Tham gia cuộc gọi video của mình trên P2P11',
      chat: 'Trò chuyện', chatPh: 'Nhập tin nhắn…', send: 'Gửi',
      footerOss: 'Mã nguồn mở trên GitHub:',
      share: 'Chia sẻ màn hình', shareStop: 'Dừng chia sẻ màn hình',
      lblSound: 'Âm báo khi có người vào hoặc rời', timerLbl: 'Thời gian cuộc gọi',
      lblMirror: 'Lật gương video (chỉ đổi cách bạn nhìn)',
      fullscreen: 'Toàn màn hình', exitFullscreen: 'Thoát toàn màn hình', pip: 'Cửa sổ nổi (PiP)', pipExit: 'Đóng cửa sổ nổi',
      full: 'Phòng đã đầy. Mỗi phòng chỉ cho phép 2 người.',

  let lang = 'vi';

  // ---------- Call logic ----------
  const PREFIX = 'vcall-';
  // Add a TURN server here if you need calls over restrictive networks (mobile data / NAT):
  const PEER_OPTS = { config: { iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun.cloudflare.com:3478' }
  ] } };

  let stream, peer, call, room;
  let guestId = null, guestConn = null; // host side: the one person allowed in
  let statsTimer = null, prev = {}, info = null, devErrKey = null, sinkId = '';
  let startedAt = null, timerId = null, audioCtx = null, soundOn = true;
  let sharing = false, sharingStream = null, remoteShare = false, gateConn = null;

  const alphabet = 'abcdefghjkmnpqrstuvwxyz23456789';
  const makeCode = () => Array.from(crypto.getRandomValues(new Uint8Array(12)), n => alphabet[n % alphabet.length]).join('');
  const clean = s => s.trim().toLowerCase().replace(/[^a-z0-9]/g, '');

  async function enter(code) {
    room = clean(code);

      stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 }, audio: { echoCancellation: true, noiseSuppression: true } });
    } catch (e) {

    loadDevices();
    inCall = true;
    keepAwake();

    $('local').srcObject = stream;
    $('roomName').textContent = room;

  // The first person into a room keeps its ID. Anyone else first asks permission over a data
  // channel: the host lets exactly one guest in and answers "full" to everyone after that.
  function startAsHost() {
    setStatus('creating');
    peer = new Peer(PREFIX + room, PEER_OPTS);
    peer.on('open', () => setStatus('waiting'));
    peer.on('connection', conn => {
      conn.on('data', d => { if (conn === guestConn) onCtl(d); });
      conn.on('open', () => {
        if (guestId && guestId !== conn.peer) {
          conn.send({ type: 'full' });
          setTimeout(() => conn.close(), 1000);
          return;
        }
        guestId = conn.peer; guestConn = conn;
        conn.send({ type: 'welcome' });
      });
      conn.on('close', () => {
        if (guestConn === conn) { guestId = null; guestConn = null; }
      });
    });
    peer.on('call', c => {
      // Only the admitted guest may call, and only once.
      if (c.peer !== guestId || (call && call.open)) { c.close(); return; }
      c.answer(stream);
      bind(c);
    });
    peer.on('error', err => {
      if (err.type === 'unavailable-id') { peer.destroy(); startAsGuest(); }
      else fail(err);
    });
  }

  function startAsGuest() {
    setStatus('connecting');
    peer = new Peer(PEER_OPTS);
    peer.on('open', () => {
      const conn = peer.connect(PREFIX + room, { reliable: true });
      gateConn = conn;
      conn.on('data', d => {
        if (!d) return;
        if (d.type === 'welcome' && !call) bind(peer.call(PREFIX + room, stream));
        else if (d.type === 'full') { setStatus('full'); try { peer.destroy(); } catch (_) {} }
        else onCtl(d);
      });
    });
    peer.on('error', err => fail(err));
  }

  function bind(c) {
    call = c; prev = {};
    c.on('stream', s => { $('remote').srcObject = s; setStatus('connected'); startTimer(); setRemoteMeter(s); });
    c.on('close', () => { $('remote').srcObject = null; setStatus('left'); stopTimer(); stopShare(false); onCtl({ type: 'share', on: false }); setRemoteMeter(null); setHand(false, false); onCtl({ type: 'hand', on: false }); });
    c.on('error', fail);
  }

  function fail(err) {
    if (STR[lang][err.type]) setStatus(err.type);
    else setStatus('error', err.type || err.message);
  }

  function leave() {
    clearInterval(statsTimer);
    try { pipWin && pipWin.close(); } catch (_) {}
    sharingStream && sharingStream.getTracks().forEach(x => x.stop());
    inCall = false;
    startedAt = null;
    clearInterval(timerId);
    try { wakeLock && wakeLock.release(); } catch (_) {}
    try { call && call.close(); peer && peer.destroy(); } catch (_) {}
    stream && stream.getTracks().forEach(tr => tr.stop());
    history.replaceState(null, '', location.pathname);

  function toggle(btn, kind) {

  // ---------- Devices ----------
  function fillSelect(sel, list, label, current) {

  async function loadDevices() {

    const cur = kind => { const tr = stream.getTracks().find(x => x.kind === kind); return tr && tr.getSettings().deviceId; };
    fillSelect($('selCam'), list.filter(d => d.kind === 'videoinput'), 'Camera', cur('video'));

  }

  async function switchDevice(kind, id) {
    devErrKey = null;
    const old = stream.getTracks().find(x => x.kind === kind);
    const oldId = old && old.getSettings().deviceId;
    const wasEnabled = old ? old.enabled : true;
    // Stop the old track first: many phones cannot open two cameras at once.
    if (old) { old.stop(); stream.removeTrack(old); }
    const open = devId => navigator.mediaDevices.getUserMedia(kind === 'video'
      ? { video: { deviceId: { exact: devId }, width: 1280, height: 720 } }

    let ns = null;
    try { ns = await open(id); }
    catch (_) {
      devErrKey = 'devErr';
      if (oldId) { try { ns = await open(oldId); } catch (_) {} }
    }
    if (ns) {
      const nt = ns.getTracks()[0];
      nt.enabled = wasEnabled;
      stream.addTrack(nt);
      if (kind === 'audio') setLocalMeter(); // the analyser must follow the new microphone
      const pc = call && call.peerConnection;

  // ---------- Connection info ----------
  const fmtVideo = v => {
    if (!v) return '—';
    const parts = [];
    if (v.w && v.h) parts.push(v.w + '×' + v.h);
    if (v.fps) parts.push(Math.round(v.fps) + ' fps');
    if (v.kbps != null) parts.push(Math.round(v.kbps) + ' kbps');
    return parts.join(', ') || '—';
  };

  function renderInfo() {
    const body = $('infoBody');
    body.textContent = '';
    if (!info) { const p = document.createElement('p'); p.textContent = t('noConn'); body.appendChild(p); return; }
    const rows = [
      ['rRoute', info.route ? t(info.route) + (info.proto ? ' (' + info.proto.toUpperCase() + ')' : '') : '—'],
      ['rRtt', info.rtt != null ? Math.round(info.rtt) + ' ms' : '—'],
      ['rOut', fmtVideo(info.out)],
      ['rIn', fmtVideo(info.inn)],
      ['rLoss', info.loss != null ? info.loss.toFixed(1) + ' %' : '—']
    ];
    const dl = document.createElement('dl');
    rows.forEach(([k, v]) => {
      const dt = document.createElement('dt'); dt.textContent = t(k);
      const dd = document.createElement('dd'); dd.textContent = v;
      dl.append(dt, dd);
    });
    body.appendChild(dl);
  }

  async function pollStats() {
    const pc = call && call.peerConnection;
    if (!pc || pc.connectionState === 'closed') { info = null; renderInfo(); return; }
    let rep;
    try { rep = await pc.getStats(); } catch (_) { return; }
    const byId = {};
    rep.forEach(r => { byId[r.id] = r; });
    let pair = null, out = null, inn = null;
    rep.forEach(r => {
      if (r.type === 'transport' && r.selectedCandidatePairId && byId[r.selectedCandidatePairId]) pair = byId[r.selectedCandidatePairId];
    });
    if (!pair) rep.forEach(r => {
      if (r.type === 'candidate-pair' && r.state === 'succeeded' && (r.nominated || r.selected)) pair = r;
    });
    rep.forEach(r => {
      if ((r.kind || r.mediaType) !== 'video' || r.isRemote) return;
      if (r.type === 'outbound-rtp') out = r;
      if (r.type === 'inbound-rtp') inn = r;
    });
    const kbps = (key, r, field) => {
      if (!r) return null;
      const p = prev[key];
      prev[key] = { b: r[field], t: r.timestamp };
      return p && r.timestamp > p.t ? (r[field] - p.b) * 8 / (r.timestamp - p.t) : null;
    };
    const lc = pair && byId[pair.localCandidateId], rc = pair && byId[pair.remoteCandidateId];
    let route = null;
    if (lc && rc) {
      const types = [lc.candidateType, rc.candidateType];
      route = types.includes('relay') ? 'routeRelay' : types.every(x => x === 'host') ? 'routeHost' : 'routeSrflx';
    }
    const lost = inn ? inn.packetsLost : 0, got = inn ? inn.packetsReceived : 0;
    info = {
      route, proto: lc && lc.protocol,
      rtt: pair && pair.currentRoundTripTime != null ? pair.currentRoundTripTime * 1000 : null,
      out: out && { w: out.frameWidth, h: out.frameHeight, fps: out.framesPerSecond, kbps: kbps('out', out, 'bytesSent') },
      inn: inn && { w: inn.frameWidth, h: inn.frameHeight, fps: inn.framesPerSecond, kbps: kbps('in', inn, 'bytesReceived') },
      loss: inn && lost + got > 0 ? lost / (lost + got) * 100 : null
    };
    renderInfo();
  }

  function togglePanel(which) {

  function updateViewButtons() {
    const fsOn = !!fsElement();
    setLabeled($('fsBtn'), fsOn ? 'shrink' : 'expand', t(fsOn ? 'exitFullscreen' : 'fullscreen'));

    $('call').classList.toggle('in-pip', document.pictureInPictureElement === remoteEl);

  }

  $('fsBtn').onclick = async () => {
    const el = $('call');

      if (fsElement()) await (document.exitFullscreen || document.webkitExitFullscreen).call(document);

      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      else if (remoteEl.webkitEnterFullscreen) remoteEl.webkitEnterFullscreen(); // iPhone: native video player
    } catch (_) {}
  };
  const pipMirrorStyle = () => { if (pipWin) remoteEl.style.transform = mirrorOn && !remoteShare ? 'scaleX(-1)' : 'none'; };

  // Moves the existing <video> into a small floating window. The browser just composites the same
  // video, so there is no extra decoding or pixel processing.
  async function openDocPip() {
    const vw = remoteEl.videoWidth || 16, vh = remoteEl.videoHeight || 9;
    const width = 360, height = Math.max(160, Math.min(640, Math.round(width * vh / vw)));
    const win = await window.documentPictureInPicture.requestWindow({ width, height });
    pipWin = win;
    win.document.body.style.cssText = 'margin:0;background:#000;overflow:hidden;';
    Object.assign(remoteEl.style, { width: '100vw', height: '100vh', objectFit: 'contain' });

    win.document.body.append(remoteEl);
    remoteEl.play().catch(() => {});
    win.addEventListener('pagehide', () => {
      remoteEl.removeAttribute('style');
      $('call').insertBefore(remoteEl, $('call').firstChild);
      remoteEl.play().catch(() => {});
      pipWin = null;
      updateViewButtons();
    });

  }

  $('pipBtn').onclick = async () => {
    try {
      if (pipWin) { pipWin.close(); return; }
      if (document.pictureInPictureElement) { await document.exitPictureInPicture(); return; }
      if (canDocPip) { try { await openDocPip(); return; } catch (_) {} } // fall back to standard PiP
      await remoteEl.requestPictureInPicture();
    } catch (_) {}
  };
  ['fullscreenchange', 'webkitfullscreenchange'].forEach(ev => document.addEventListener(ev, updateViewButtons));
  ['loadedmetadata', 'emptied', 'enterpictureinpicture', 'leavepictureinpicture'].forEach(ev => remoteEl.addEventListener(ev, updateViewButtons));

  // ---------- Mirror view (display only, the stream sent to the other person is not changed) ----------
  let mirrorOn = true;
  try { mirrorOn = localStorage.getItem('mirror') !== '0'; } catch (_) {}
  const applyMirror = () => { $('call').classList.toggle('mirror', mirrorOn); $('mirrorChk').checked = mirrorOn; pipMirrorStyle(); };
  $('mirrorChk').onchange = e => {
    mirrorOn = e.target.checked;
    try { localStorage.setItem('mirror', mirrorOn ? '1' : '0'); } catch (_) {}
    applyMirror();
  };
  applyMirror();

  // ---------- Screen sharing ----------
  // The screen track replaces the camera track on the existing connection (no renegotiation).
  // The other side is told over the data channel so it can switch off its mirror effect,
  // otherwise shared text would read backwards.
  const canShare = !!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia);
  if (!canShare) $('shareBtn').style.display = 'none';

  function sendCtl(msg) {
    const c = guestConn || gateConn;
    try { if (c && c.open) { c.send(msg); return true; } } catch (_) {}
    return false;
  }
  function onCtl(d) {
    if (!d) return;
    if (d.type === 'chat') return onChat(d);
    if (d.type === 'react') return onReact(d);
    if (d.type === 'hand') return onHand(d);
    if (d.type !== 'share') return;
    remoteShare = !!d.on;
    $('call').classList.toggle('remote-share', remoteShare);
    pipMirrorStyle();
  }
  function updateShareButton() {
    setLabeled($('shareBtn'), 'screen', t(sharing ? 'shareStop' : 'share'));
    $('shareBtn').setAttribute('aria-pressed', sharing);
    $('shareBtn').disabled = !sharing && !startedAt; // needs a connected call
    updateChatState();
    updateReactUI();
    // The share button lives in the More menu, so flag an active share on the menu button itself.
    const moreLabel = t('more') + (sharing ? ', ' + t('sharingNow') : '');
    $('moreBtn').setAttribute('aria-label', moreLabel);
    $('moreBtn').title = moreLabel;
    $('moreDot').hidden = !sharing;
  }

  async function startShare() {
    if (sharing) return stopShare(true);
    const pc = call && call.peerConnection;
    if (!pc) return;
    let ds;
    try { ds = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: { ideal: 15 } }, audio: false }); }
    catch (_) { return; } // cancelled
    const track = ds.getVideoTracks()[0];
    const sender = pc.getSenders().find(x => x.track && x.track.kind === 'video');
    if (!track || !sender) { ds.getTracks().forEach(x => x.stop()); return; }
    try { track.contentHint = 'detail'; } catch (_) {} // favor sharp text over frame rate
    try { await sender.replaceTrack(track); }
    catch (_) { ds.getTracks().forEach(x => x.stop()); return; }
    sharing = true; sharingStream = ds;
    track.addEventListener('ended', () => stopShare(true)); // browser's own "Stop sharing" bar
    $('local').srcObject = ds;
    $('call').classList.add('sharing');
    sendCtl({ type: 'share', on: true });
    updateShareButton();
  }

  function stopShare(notify) {
    if (!sharing) return;
    sharing = false;
    const ds = sharingStream; sharingStream = null;
    if (ds) ds.getTracks().forEach(x => x.stop());
    const cam = stream && stream.getVideoTracks()[0];
    const pc = call && call.peerConnection;
    const sender = pc && pc.getSenders().find(x => x.track && x.track.kind === 'video');
    if (sender && cam) sender.replaceTrack(cam).catch(() => {});
    $('local').srcObject = stream;
    $('call').classList.remove('sharing');
    if (notify) sendCtl({ type: 'share', on: false });
    updateShareButton();
  }
  $('shareBtn').onclick = startShare;

  // ---------- Install as an app (PWA) ----------
  const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let installEvent = null;

  if ('serviceWorker' in navigator) {
    // Needs HTTPS or localhost; fails quietly elsewhere (e.g. when opened from file://).
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    installEvent = e;
    if (!isStandalone()) $('installBtn').hidden = false;
  });
  window.addEventListener('appinstalled', () => {
    installEvent = null;
    $('installBtn').hidden = true;
    $('iosHint').hidden = true;
  });
  $('installBtn').onclick = async () => {
    if (!installEvent) return;
    installEvent.prompt();
    try { await installEvent.userChoice; } catch (_) {}
    installEvent = null;
    $('installBtn').hidden = true;
  };
  // iOS Safari has no install prompt, so show the manual steps instead.
  if (isIOS && !isStandalone()) $('iosHint').hidden = false;

  // ---------- Quick share of the room link (Web Share API: opens the system share sheet) ----------
  if (!navigator.share) $('shareLinkBtn').style.display = 'none'; // e.g. Firefox desktop; Copy link still works
  $('shareLinkBtn').onclick = async () => {
    try { await navigator.share({ title: 'P2P11', text: t('shareText'), url: location.href }); }
    catch (e) { if (e.name !== 'AbortError') $('copy').click(); } // share failed: fall back to copying the link
  };

  // ---------- Speaking indicator and mic level ----------
  // Web Audio analysers read the volume of your mic and of the other person's audio 10 times a second.
  // They are not connected to the speakers, so nothing is played twice, and nothing is sent anywhere.
  const meters = { local: null, remote: null };
  const SPEAK_ON = 0.03, HOLD_MS = 450; // volume that counts as speaking, and how long the indicator lingers

  function makeMeter(ms) {
    if (!audioCtx || !ms || !ms.getAudioTracks().length) return null;
    try {
      const src = audioCtx.createMediaStreamSource(new MediaStream(ms.getAudioTracks()));
      const an = audioCtx.createAnalyser();
      an.fftSize = 512;
      src.connect(an);
      return { src, an, buf: new Uint8Array(an.fftSize), level: 0, speaking: false, last: 0 };
    } catch (_) { return null; }
  }
  function dropMeter(m) { if (m) { try { m.src.disconnect(); } catch (_) {} } }
  function setLocalMeter() { dropMeter(meters.local); meters.local = makeMeter(stream); }
  function setRemoteMeter(ms) { dropMeter(meters.remote); meters.remote = makeMeter(ms); }

  function readLevel(m, now) {
    m.an.getByteTimeDomainData(m.buf);
    let sum = 0;
    for (let i = 0; i < m.buf.length; i++) { const v = (m.buf[i] - 128) / 128; sum += v * v; }
    const rms = Math.sqrt(sum / m.buf.length);
    if (rms > SPEAK_ON) m.last = now;
    m.speaking = now - m.last < HOLD_MS;
    const target = Math.min(1, rms * 5);
    m.level = target > m.level ? target : m.level * 0.8 + target * 0.2; // fast attack, slow release
  }
  const setSpeaking = (el, on) => { if (el.classList.contains('on') !== on) el.classList.toggle('on', on); };
  const BAR_AMP = [0.7, 1, 0.55]; // the middle bar moves the most
  // Three-bar badge inside a video: visible only while that person speaks, bars follow the volume.
  function showVu(el, m, now) {
    const on = !!(m && m.speaking);
    setSpeaking(el, on);
    if (!on) return;
    for (let i = 0; i < 3; i++) {
      const wave = 0.65 + 0.35 * Math.sin(now / 110 + i * 2.1);
      el.children[i].style.height = (4 + m.level * BAR_AMP[i] * wave * 12).toFixed(1) + 'px';
    }
  }

  function tickMeters() {
    if (document.hidden) return;
    const now = performance.now(), l = meters.local, r = meters.remote;
    if (l) readLevel(l, now);
    if (r) readLevel(r, now);
    const micOff = $('mic').getAttribute('aria-pressed') === 'true';
    $('mic').style.setProperty('--lvl', (l && !micOff ? l.level : 0).toFixed(2));
    showVu($('vuLocal'), l && !micOff ? l : null, now);
    showVu($('vuRemote'), r, now);
  }
  setInterval(tickMeters, 100);

  // ---------- Text chat ----------
  // Messages travel over the same encrypted peer-to-peer data channel as the screen-share signal.
  // They are only kept in this page's memory and are gone when the page closes.
  const CHAT_MAX = 1000;
  let unread = 0;

  function renderBadge() {
    $('chatBadge').hidden = unread === 0;
    $('chatBadge').textContent = unread > 9 ? '9+' : String(unread);
  }
  function updateChatState() {
    const on = !!startedAt; // needs a connected call
    $('chatInput').disabled = !on;
    $('chatSend').disabled = !on;
  }
  function pushMsg(el) {
    const box = $('msgs');
    const stick = box.scrollTop + box.clientHeight >= box.scrollHeight - 40;
    box.append(el);
    while (box.children.length > 200) box.firstChild.remove();
    if (stick || el.classList.contains('mine')) box.scrollTop = box.scrollHeight;
  }
  function addMsg(text, mine) {
    const div = document.createElement('div');
    div.className = 'msg ' + (mine ? 'mine' : 'theirs');
    div.append(document.createTextNode(text)); // text only, never HTML
    const tm = document.createElement('time');
    tm.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    div.append(tm);
    pushMsg(div);
  }
  function addSys(text) {
    const div = document.createElement('div');
    div.className = 'msg sys';
    div.textContent = text;
    pushMsg(div);
  }
  function onChat(d) {
    if (typeof d.text !== 'string') return;
    const text = d.text.slice(0, CHAT_MAX).trim();
    if (!text) return;
    addMsg(text, false);
    if (!$('chatPanel').classList.contains('on')) { unread++; renderBadge(); }
    playTone([740]);
  }
  function sendChat() {
    const input = $('chatInput');
    const text = input.value.trim().slice(0, CHAT_MAX);
    if (!text || !startedAt) return;
    if (sendCtl({ type: 'chat', text })) { addMsg(text, true); input.value = ''; }
  }
  $('chatSend').onclick = sendChat;
  $('chatInput').addEventListener('keydown', e => {
    // isComposing keeps Enter from sending while a Vietnamese/CJK input method is still composing.
    if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); sendChat(); }
  });
  $('chatBtn').onclick = () => togglePanel('chat');

  // ---------- Emoji reactions and raise hand ----------
  // Sent over the same data channel. Only emojis from this fixed list are accepted from the other
  // side, and incoming reactions are rate-limited, so a modified client cannot flood the screen.
  const EMOJIS = ['👍', '❤️', '😂', '😮', '👏', '🎉'];
  let myHand = false, remoteHand = false, recentReacts = [];

  function announce(msg) { // read out by screen readers
    $('live').textContent = '';
    setTimeout(() => { $('live').textContent = msg; }, 50);
  }
  function flyEmoji(emoji, mine) {
    if ($('call').querySelectorAll('.fly').length >= 24) return;
    const el = document.createElement('span');
    el.className = 'fly ' + (mine ? 'mine' : 'theirs');
    el.textContent = emoji;
    el.setAttribute('aria-hidden', 'true');
    el.style.setProperty('--dx', Math.round(Math.random() * 40 - 20) + 'px');
    el.style.setProperty('--off', Math.round(Math.random() * 40) + 'px');
    el.addEventListener('animationend', () => el.remove());
    $('call').append(el);
  }
  function sendReaction(emoji) {
    if (!startedAt || !EMOJIS.includes(emoji)) return;
    if (sendCtl({ type: 'react', emoji })) flyEmoji(emoji, true);
  }
  function onReact(d) {
    if (!EMOJIS.includes(d.emoji)) return;
    const now = performance.now();
    recentReacts = recentReacts.filter(x => now - x < 1000);
    if (recentReacts.length >= 5) return;
    recentReacts.push(now);
    flyEmoji(d.emoji, false);
  }

  function updateReactUI() {
    const on = !!startedAt; // needs a connected call
    document.querySelectorAll('#emojis .emo').forEach(b => { b.disabled = !on; });
    $('handBtn').disabled = !on && !myHand;
    $('handBtn').setAttribute('aria-pressed', myHand);
    $('handLabel').textContent = t(myHand ? 'handLower' : 'handRaise');
    $('handDot').hidden = !myHand;
    $('handLocal').classList.toggle('on', myHand);
  }
  function setHand(on, notify) {
    myHand = !!on;
    if (notify) sendCtl({ type: 'hand', on: myHand });
    updateReactUI();
  }
  function onHand(d) {
    const on = !!d.on;
    if (on === remoteHand) return;
    remoteHand = on;
    $('handRemote').classList.toggle('on', on);
    announce(t(on ? 'remoteHandUp' : 'remoteHandDown'));
    if (on) playTone([880, 880]);
  }

  EMOJIS.forEach(e => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'emo';
    b.textContent = e;
    b.setAttribute('aria-label', e);
    b.disabled = true;
    b.onclick = () => sendReaction(e);
    $('emojis').append(b);
  });
  $('handBtn').onclick = () => setHand(!myHand, true);
  $('reactBtn').onclick = () => togglePanel('react');

  // ---------- "More" menu (Picture-in-Picture, Fullscreen, Devices, Info) ----------
  function closeMenu() {
    $('moreMenu').classList.remove('on');
    $('moreBtn').setAttribute('aria-expanded', 'false');
  }
  $('moreBtn').onclick = () => togglePanel('more');
  // Click outside closes only the menu; other panels stay open.
  document.addEventListener('click', e => {
    if ($('moreMenu').classList.contains('on') && !e.target.closest('#moreMenu, #moreBtn')) closeMenu();
  });
  // Share screen, Picture-in-Picture and Fullscreen are one-shot actions, so the menu closes after them.
  $('moreMenu').addEventListener('click', e => { if (e.target.closest('#shareBtn, #pipBtn, #fsBtn')) closeMenu(); });

  // ---------- Call timer and join/leave sounds ----------
  try { soundOn = localStorage.getItem('sound') !== '0'; } catch (_) {}
  $('soundChk').checked = soundOn;
  $('soundChk').onchange = e => {
    soundOn = e.target.checked;
    try { localStorage.setItem('sound', soundOn ? '1' : '0'); } catch (_) {}
    if (soundOn) playTone([660, 880]); // preview
  };

  // Short two-note chime made with Web Audio, so no audio files are needed.
  function playTone(freqs) {
    if (!soundOn || !audioCtx) return;
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const t0 = audioCtx.currentTime;
      freqs.forEach((f, i) => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain(), st = t0 + i * 0.14;
        o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, st);
        g.gain.exponentialRampToValueAtTime(0.18, st + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, st + 0.22);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(st); o.stop(st + 0.25);
      });
    } catch (_) {}
  }

  const pad2 = n => String(n).padStart(2, '0');
  function fmtTime(ms) {
    const sec = Math.floor(ms / 1000), h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60);
    return (h ? h + ':' + pad2(m) : pad2(m)) + ':' + pad2(sec % 60);
  }
  const tick = () => { $('timer').textContent = fmtTime(Date.now() - startedAt); };

  function startTimer() {
    if (startedAt) return; // the 'stream' event can fire more than once
    startedAt = Date.now();
    updateShareButton();
    $('timer').hidden = false;
    tick();
    timerId = setInterval(tick, 1000);
    playTone([660, 880]);
  }
  function stopTimer() {
    if (!startedAt) return;
    clearInterval(timerId);
    startedAt = null;
    updateShareButton();
    $('timer').hidden = true;
    if ($('msgs').children.length) addSys(t('left'));
    playTone([660, 440]);
  }

  // ---------- Keep the screen awake during a call (Screen Wake Lock) ----------
  // The browser drops the lock whenever the tab is hidden, so request it again when the tab returns.
  let wakeLock = null, inCall = false;
  async function keepAwake() {
    if (!('wakeLock' in navigator) || !inCall || wakeLock) return;
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } catch (_) { wakeLock = null; } // denied, e.g. low battery mode
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') keepAwake();
  });

  // Opened via a room link: prefill the code and wait for a click so the browser can ask for camera permission.
  const fromHash = clean(location.hash.slice(1));
  if (fromHash) $('code').value = fromHash;

  render();
})();
</script>
</body>
</html>
