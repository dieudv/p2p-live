<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>p2p-live</title>
<style>
  :root {
    --bg: #e8edf1; --ink: #14212b; --muted: #5b6b78; --panel: #ffffff;
    --accent: #0e7c86; --accent-ink: #ffffff; --danger: #c2412d; --stage: #101a22;
    --line: #cfd8df;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1419; --ink: #e6edf2; --muted: #8fa1ae; --panel: #16212a; --line: #26343f; --stage: #05090c; --accent: #2bb3bf; --accent-ink: #04161a; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, input { font: inherit; color: inherit; }
  .lobby { min-height: 100%; display: grid; place-items: center; padding: 24px; position: relative; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 28px; width: min(420px, 100%); }
  h1 { margin: 0 0 6px; font-size: 1.6rem; letter-spacing: -0.01em; }
  p.sub { margin: 0 0 22px; color: var(--muted); }
  .btn { border: 0; border-radius: 10px; padding: 12px 18px; cursor: pointer; background: var(--accent); color: var(--accent-ink); font-weight: 600; width: 100%; }
  .btn:focus-visible, .ctl:focus-visible, .lang:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .or { text-align: center; color: var(--muted); margin: 16px 0; font-size: .9rem; }
  .row { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: transparent; }
  .row .btn { width: auto; background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .err { color: var(--danger); margin: 14px 0 0; min-height: 1.4em; font-size: .92rem; }
  .lang { position: absolute; top: 16px; right: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: .9rem; }

  .call { display: none; position: fixed; inset: 0; background: var(--stage); }
  .call.on { display: block; }
  #remote { width: 100%; height: 100%; object-fit: contain; background: var(--stage); }
  #local { position: absolute; right: 16px; bottom: 92px; width: min(28vw, 220px); aspect-ratio: 4/3; object-fit: cover; border-radius: 12px; border: 2px solid rgba(255,255,255,.25); background: #000; transform: scaleX(-1); }
  .status { position: absolute; top: 16px; left: 16px; right: 16px; display: flex; gap: 10px; align-items: center; justify-content: space-between; color: #fff; }
  .pill { background: rgba(0,0,0,.55); padding: 8px 14px; border-radius: 999px; font-size: .92rem; }
  .pill button { background: none; border: 0; color: #fff; text-decoration: underline; cursor: pointer; padding: 0 0 0 8px; }
  .bar { position: absolute; left: 0; right: 0; bottom: 20px; display: flex; justify-content: center; gap: 12px; }
  .ctl { border: 0; border-radius: 999px; padding: 12px 20px; background: rgba(255,255,255,.14); color: #fff; cursor: pointer; font-weight: 600; }
  .ctl[aria-pressed="true"] { background: #fff; color: #111; }
  .ctl.hang { background: var(--danger); }
  .bar { flex-wrap: wrap; gap: 8px; padding: 0 12px; }
  .ctl { padding: 10px 16px; }
  .ctl[aria-expanded="true"] { background: #fff; color: #111; }
  .panel { display: none; position: absolute; left: 16px; bottom: 84px; z-index: 5; width: min(360px, calc(100% - 32px)); max-height: calc(100% - 160px); overflow: auto; background: rgba(16,26,34,.94); color: #fff; border: 1px solid rgba(255,255,255,.18); border-radius: 12px; padding: 16px; }
  .panel.on { display: block; }
  .panel h2 { margin: 0 0 12px; font-size: 1rem; }
  .panel label { display: block; margin-bottom: 12px; font-size: .88rem; color: #b9c6d0; }
  .panel select { display: block; width: 100%; margin-top: 4px; padding: 9px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,.25); background: #0b1217; color: #fff; font: inherit; }
  .panel select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .panel .err { color: #ff9b8a; margin: 0; min-height: 0; }
  .panel dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; font-size: .9rem; }
  .panel dt { color: #b9c6d0; }
  .panel dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  .panel p { margin: 0; color: #b9c6d0; font-size: .9rem; }
  .ctl { width: 48px; height: 48px; padding: 0; display: inline-grid; place-items: center; }
  .ctl svg { width: 22px; height: 22px; display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .pill button { display: inline-flex; vertical-align: middle; align-items: center; }
  .pill button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ctl:disabled { opacity: .4; cursor: not-allowed; }
  @media (max-width: 600px) { #local { bottom: 144px; } .panel { bottom: 144px; } }
</style>
</head>
<body>

<main class="lobby" id="lobby">
  <button class="lang" id="lang" type="button" aria-label="Language / Ngôn ngữ"></button>
  <div class="card">
    <h1>p2p-live</h1>
    <p class="sub" data-i18n="sub"></p>
    <button class="btn" id="create" data-i18n="create"></button>
    <div class="or" data-i18n="or"></div>
    <div class="row">
      <input id="code" autocomplete="off" maxlength="32" data-i18n-ph="codePh" data-i18n-aria="codePh">
      <button class="btn" id="join" data-i18n="join"></button>
    </div>
    <p class="err" id="err" role="alert"></p>
  </div>
</main>

<section class="call" id="call">
  <video id="remote" autoplay playsinline></video>
  <video id="local" autoplay playsinline muted></video>
  <div class="status">
    <span class="pill" id="status"></span>
    <span class="pill"><span data-i18n="room"></span> <b id="roomName"></b><button id="copy"></button></span>
  </div>
  <div class="panel" id="devPanel" role="dialog" aria-labelledby="devTitle">
    <h2 id="devTitle" data-i18n="devices"></h2>
    <label><span data-i18n="lblCam"></span><select id="selCam"></select></label>
    <label><span data-i18n="lblMic"></span><select id="selMic"></select></label>
    <label id="spkRow"><span data-i18n="lblSpk"></span><select id="selSpk"></select></label>
    <p class="err" id="devErr" role="alert"></p>
  </div>
  <div class="panel" id="infoPanel" role="dialog" aria-labelledby="infoTitle">
    <h2 id="infoTitle" data-i18n="infoTitle"></h2>
    <div id="infoBody"></div>
  </div>
  <div class="bar">
    <button class="ctl" id="mic" aria-pressed="false"></button>
    <button class="ctl" id="cam" aria-pressed="false"></button>
    <button class="ctl" id="pipBtn" aria-pressed="false" disabled></button>
    <button class="ctl" id="fsBtn" aria-pressed="false"></button>
    <button class="ctl" id="devBtn" aria-expanded="false" aria-controls="devPanel" data-i18n-label="devices"><svg viewBox="0 0 24 24" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="9" cy="7" r="2.2"/><circle cx="15" cy="17" r="2.2"/></svg></button>
    <button class="ctl" id="infoBtn" aria-expanded="false" aria-controls="infoPanel" data-i18n-label="info"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16"/><path d="M12 8h.01"/></svg></button>
    <button class="ctl hang" id="hang" data-i18n-label="hang"><svg viewBox="0 0 24 24" aria-hidden="true" style="transform:rotate(135deg)"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg></button>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);

  // ---------- i18n ----------
  const STR = {
    vi: {
      sub: 'Kết nối trực tiếp giữa hai trình duyệt, không lưu video trên máy chủ.',
      create: 'Tạo phòng mới', or: 'hoặc nhập mã phòng', codePh: 'Mã phòng', join: 'Vào phòng',
      room: 'Phòng', copy: 'Sao chép link', copied: 'Đã sao chép', copyPrompt: 'Sao chép link này:',
      micOn: 'Tắt mic', micOff: 'Bật mic', camOn: 'Tắt camera', camOff: 'Bật camera', hang: 'Kết thúc',
      switchTo: 'English',
      fullscreen: 'Toàn màn hình', exitFullscreen: 'Thoát toàn màn hình', pip: 'Cửa sổ nổi (PiP)', pipExit: 'Đóng cửa sổ nổi',
      full: 'Phòng đã đầy. Mỗi phòng chỉ cho phép 2 người.',
      devices: 'Thiết bị', info: 'Thông tin', lblCam: 'Camera', lblMic: 'Micro', lblSpk: 'Loa',
      devDefault: 'Mặc định', devErr: 'Không đổi được thiết bị. Đã thử khôi phục thiết bị cũ.',
      infoTitle: 'Thông tin kết nối', noConn: 'Chưa có kết nối với người kia.',
      rRoute: 'Đường truyền', rRtt: 'Độ trễ', rOut: 'Video gửi đi', rIn: 'Video nhận về', rLoss: 'Mất gói tin',
      routeHost: 'Trực tiếp, cùng mạng hoặc IPv6 (host)', routeSrflx: 'Trực tiếp qua Internet (P2P)', routeRelay: 'Qua máy chủ TURN',
      needCode: 'Hãy nhập mã phòng.',
      noMedia: 'Không truy cập được camera/mic. Hãy cho phép quyền trong trình duyệt rồi thử lại.',
      creating: 'Đang tạo phòng…', waiting: 'Đang chờ người kia vào… Gửi link cho họ.',
      connecting: 'Đang kết nối…', connected: 'Đã kết nối', left: 'Người kia đã rời phòng',
      'peer-unavailable': 'Không tìm thấy phòng. Người tạo phòng có thể đã thoát.',
      network: 'Mất kết nối tới máy chủ báo hiệu.',
      'server-error': 'Máy chủ báo hiệu đang lỗi, hãy thử lại sau.',
      error: 'Lỗi: '
    },
    en: {
      sub: 'Direct connection between two browsers. No video is stored on any server.',
      create: 'Create new room', or: 'or enter a room code', codePh: 'Room code', join: 'Join room',
      room: 'Room', copy: 'Copy link', copied: 'Copied', copyPrompt: 'Copy this link:',
      micOn: 'Mute', micOff: 'Unmute', camOn: 'Camera off', camOff: 'Camera on', hang: 'Hang up',
      switchTo: 'Tiếng Việt',
      fullscreen: 'Fullscreen', exitFullscreen: 'Exit fullscreen', pip: 'Picture-in-Picture', pipExit: 'Exit Picture-in-Picture',
      full: 'This room is full. Only 2 people are allowed per room.',
      devices: 'Devices', info: 'Info', lblCam: 'Camera', lblMic: 'Microphone', lblSpk: 'Speaker',
      devDefault: 'Default', devErr: 'Could not switch device. Tried to restore the previous one.',
      infoTitle: 'Connection info', noConn: 'Not connected to the other person yet.',
      rRoute: 'Path', rRtt: 'Latency', rOut: 'Video sent', rIn: 'Video received', rLoss: 'Packet loss',
      routeHost: 'Direct, same network or IPv6 (host)', routeSrflx: 'Direct over the Internet (P2P)', routeRelay: 'Relayed through TURN server',
      needCode: 'Please enter a room code.',
      noMedia: 'Could not access the camera/mic. Allow permission in your browser and try again.',
      creating: 'Creating room…', waiting: 'Waiting for the other person… Send them the link.',
      connecting: 'Connecting…', connected: 'Connected', left: 'The other person left the room',
      'peer-unavailable': 'Room not found. The host may have left.',
      network: 'Lost connection to the signaling server.',
      'server-error': 'The signaling server has an error, please try again later.',
      error: 'Error: '
    }
  };

  let lang = 'vi';
  try { lang = localStorage.getItem('lang') || ''; } catch (_) {}
  if (!STR[lang]) lang = (navigator.language || 'vi').toLowerCase().startsWith('vi') ? 'vi' : 'en';
  const t = k => STR[lang][k] || k;

  // ---------- Icons (inline SVG, no external files) ----------
  const ICONS = {
    mic: '<path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3"/>',
    micOff: '<path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3"/><line x1="3" y1="3" x2="21" y2="21"/>',
    cam: '<rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3z"/>',
    camOff: '<rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3z"/><line x1="3" y1="3" x2="21" y2="21"/>',
    link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
    check: '<path d="M20 6L9 17l-5-5"/>',
    expand: '<path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>',
    shrink: '<path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/>',
    pip: '<rect x="3" y="5" width="18" height="14" rx="2"/><rect x="12" y="12" width="6" height="4" rx="1"/>'
  };
  const ico = name => '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[name] + '</svg>';
  function setLabeled(btn, iconName, label) {
    btn.innerHTML = ico(iconName);
    btn.setAttribute('aria-label', label);
    btn.title = label;
  }
  const setCopy = done => setLabeled($('copy'), done ? 'check' : 'link', t(done ? 'copied' : 'copy'));

  let statusKey = null, statusRaw = '';
  const setStatus = (key, raw = '') => { statusKey = key; statusRaw = raw; renderStatus(); };
  const renderStatus = () => { $('status').textContent = statusKey ? (statusKey === 'error' ? t('error') + statusRaw : t(statusKey)) : ''; };
  let errKey = null;
  const showErr = key => { errKey = key; $('err').textContent = key ? t(key) : ''; };

  function render() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
    document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = t(el.dataset.i18nPh));
    document.querySelectorAll('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', t(el.dataset.i18nAria)));
    $('lang').textContent = t('switchTo');
    document.querySelectorAll('[data-i18n-label]').forEach(el => {
      const l = t(el.dataset.i18nLabel);
      el.setAttribute('aria-label', l);
      el.title = l;
    });
    const micOff = $('mic').getAttribute('aria-pressed') === 'true';
    const camOff = $('cam').getAttribute('aria-pressed') === 'true';
    setLabeled($('mic'), micOff ? 'micOff' : 'mic', t(micOff ? 'micOff' : 'micOn'));
    setLabeled($('cam'), camOff ? 'camOff' : 'cam', t(camOff ? 'camOff' : 'camOn'));
    setCopy(false);
    renderStatus();
    $('err').textContent = errKey ? t(errKey) : '';
    $('devErr').textContent = devErrKey ? t(devErrKey) : '';
    loadDevices();
    renderInfo();
    updateViewButtons();
  }

  $('lang').onclick = () => {
    lang = lang === 'vi' ? 'en' : 'vi';
    try { localStorage.setItem('lang', lang); } catch (_) {}
    render();
  };

  // ---------- Call logic ----------
  const PREFIX = 'vcall-';
  // Add a TURN server here if you need calls over restrictive networks (mobile data / NAT):
  const PEER_OPTS = { config: { iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun.cloudflare.com:3478' }
  ] } };

  let stream, peer, call, room;
  let guestId = null, guestConn = null; // host side: the one person allowed in
  let statsTimer = null, prev = {}, info = null, devErrKey = null, sinkId = '';

  const alphabet = 'abcdefghjkmnpqrstuvwxyz23456789';
  const makeCode = () => Array.from(crypto.getRandomValues(new Uint8Array(12)), n => alphabet[n % alphabet.length]).join('');
  const clean = s => s.trim().toLowerCase().replace(/[^a-z0-9]/g, '');

  async function enter(code) {
    room = clean(code);
    if (!room) return showErr('needCode');
    showErr(null);
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 }, audio: { echoCancellation: true, noiseSuppression: true } });
    } catch (e) {
      return showErr('noMedia');
    }
    location.hash = room;
    loadDevices();
    $('local').srcObject = stream;
    $('roomName').textContent = room;
    $('lobby').style.display = 'none';
    $('call').classList.add('on');
    startAsHost();
  }

  // The first person into a room keeps its ID. Anyone else first asks permission over a data
  // channel: the host lets exactly one guest in and answers "full" to everyone after that.
  function startAsHost() {
    setStatus('creating');
    peer = new Peer(PREFIX + room, PEER_OPTS);
    peer.on('open', () => setStatus('waiting'));
    peer.on('connection', conn => {
      conn.on('open', () => {
        if (guestId && guestId !== conn.peer) {
          conn.send({ type: 'full' });
          setTimeout(() => conn.close(), 1000);
          return;
        }
        guestId = conn.peer; guestConn = conn;
        conn.send({ type: 'welcome' });
      });
      conn.on('close', () => {
        if (guestConn === conn) { guestId = null; guestConn = null; }
      });
    });
    peer.on('call', c => {
      // Only the admitted guest may call, and only once.
      if (c.peer !== guestId || (call && call.open)) { c.close(); return; }
      c.answer(stream);
      bind(c);
    });
    peer.on('error', err => {
      if (err.type === 'unavailable-id') { peer.destroy(); startAsGuest(); }
      else fail(err);
    });
  }

  function startAsGuest() {
    setStatus('connecting');
    peer = new Peer(PEER_OPTS);
    peer.on('open', () => {
      const conn = peer.connect(PREFIX + room, { reliable: true });
      conn.on('data', d => {
        if (!d) return;
        if (d.type === 'welcome' && !call) bind(peer.call(PREFIX + room, stream));
        else if (d.type === 'full') { setStatus('full'); try { peer.destroy(); } catch (_) {} }
      });
    });
    peer.on('error', err => fail(err));
  }

  function bind(c) {
    call = c; prev = {};
    c.on('stream', s => { $('remote').srcObject = s; setStatus('connected'); });
    c.on('close', () => { $('remote').srcObject = null; setStatus('left'); });
    c.on('error', fail);
  }

  function fail(err) {
    if (STR[lang][err.type]) setStatus(err.type);
    else setStatus('error', err.type || err.message);
  }

  function leave() {
    clearInterval(statsTimer);
    try { call && call.close(); peer && peer.destroy(); } catch (_) {}
    stream && stream.getTracks().forEach(tr => tr.stop());
    history.replaceState(null, '', location.pathname);
    location.reload();
  }

  function toggle(btn, kind) {
    btn.addEventListener('click', () => {
      const tracks = kind === 'audio' ? stream.getAudioTracks() : stream.getVideoTracks();
      const off = btn.getAttribute('aria-pressed') !== 'true';
      tracks.forEach(tr => tr.enabled = !off);
      btn.setAttribute('aria-pressed', off);
      render();
    });
  }

  $('create').onclick = () => enter(makeCode());
  $('join').onclick = () => enter($('code').value);
  $('code').addEventListener('keydown', e => { if (e.key === 'Enter') enter($('code').value); });
  $('hang').onclick = leave;
  $('copy').onclick = async () => {
    try { await navigator.clipboard.writeText(location.href); setCopy(true); }
    catch (_) { prompt(t('copyPrompt'), location.href); }
    setTimeout(() => setCopy(false), 1800);
  };
  toggle($('mic'), 'audio');
  toggle($('cam'), 'video');

  // ---------- Devices ----------
  function fillSelect(sel, list, label, current) {
    sel.textContent = '';
    list.forEach((d, i) => {
      const o = document.createElement('option');
      o.value = d.deviceId;
      o.textContent = d.label || (d.deviceId === 'default' ? t('devDefault') : label + ' ' + (i + 1));
      sel.appendChild(o);
    });
    if (current && list.some(d => d.deviceId === current)) sel.value = current;
  }

  async function loadDevices() {
    if (!stream || !navigator.mediaDevices.enumerateDevices) return;
    let list = [];
    try { list = await navigator.mediaDevices.enumerateDevices(); } catch (_) { return; }
    const cur = kind => { const tr = stream.getTracks().find(x => x.kind === kind); return tr && tr.getSettings().deviceId; };
    fillSelect($('selCam'), list.filter(d => d.kind === 'videoinput'), 'Camera', cur('video'));
    fillSelect($('selMic'), list.filter(d => d.kind === 'audioinput'), 'Mic', cur('audio'));
    const canSink = 'setSinkId' in HTMLMediaElement.prototype;
    $('spkRow').style.display = canSink ? '' : 'none';
    if (canSink) fillSelect($('selSpk'), list.filter(d => d.kind === 'audiooutput'), 'Speaker', sinkId);
  }

  async function switchDevice(kind, id) {
    devErrKey = null;
    const old = stream.getTracks().find(x => x.kind === kind);
    const oldId = old && old.getSettings().deviceId;
    const wasEnabled = old ? old.enabled : true;
    // Stop the old track first: many phones cannot open two cameras at once.
    if (old) { old.stop(); stream.removeTrack(old); }
    const open = devId => navigator.mediaDevices.getUserMedia(kind === 'video'
      ? { video: { deviceId: { exact: devId }, width: 1280, height: 720 } }
      : { audio: { deviceId: { exact: devId }, echoCancellation: true, noiseSuppression: true } });
    let ns = null;
    try { ns = await open(id); }
    catch (_) {
      devErrKey = 'devErr';
      if (oldId) { try { ns = await open(oldId); } catch (_) {} }
    }
    if (ns) {
      const nt = ns.getTracks()[0];
      nt.enabled = wasEnabled;
      stream.addTrack(nt);
      const pc = call && call.peerConnection;
      const sender = pc && pc.getSenders().find(x => x.track && x.track.kind === kind);
      if (sender) { try { await sender.replaceTrack(nt); } catch (_) {} }
      $('local').srcObject = null;
      $('local').srcObject = stream;
    }
    render();
  }

  // ---------- Connection info ----------
  const fmtVideo = v => {
    if (!v) return '—';
    const parts = [];
    if (v.w && v.h) parts.push(v.w + '×' + v.h);
    if (v.fps) parts.push(Math.round(v.fps) + ' fps');
    if (v.kbps != null) parts.push(Math.round(v.kbps) + ' kbps');
    return parts.join(', ') || '—';
  };

  function renderInfo() {
    const body = $('infoBody');
    body.textContent = '';
    if (!info) { const p = document.createElement('p'); p.textContent = t('noConn'); body.appendChild(p); return; }
    const rows = [
      ['rRoute', info.route ? t(info.route) + (info.proto ? ' (' + info.proto.toUpperCase() + ')' : '') : '—'],
      ['rRtt', info.rtt != null ? Math.round(info.rtt) + ' ms' : '—'],
      ['rOut', fmtVideo(info.out)],
      ['rIn', fmtVideo(info.inn)],
      ['rLoss', info.loss != null ? info.loss.toFixed(1) + ' %' : '—']
    ];
    const dl = document.createElement('dl');
    rows.forEach(([k, v]) => {
      const dt = document.createElement('dt'); dt.textContent = t(k);
      const dd = document.createElement('dd'); dd.textContent = v;
      dl.append(dt, dd);
    });
    body.appendChild(dl);
  }

  async function pollStats() {
    const pc = call && call.peerConnection;
    if (!pc || pc.connectionState === 'closed') { info = null; renderInfo(); return; }
    let rep;
    try { rep = await pc.getStats(); } catch (_) { return; }
    const byId = {};
    rep.forEach(r => { byId[r.id] = r; });
    let pair = null, out = null, inn = null;
    rep.forEach(r => {
      if (r.type === 'transport' && r.selectedCandidatePairId && byId[r.selectedCandidatePairId]) pair = byId[r.selectedCandidatePairId];
    });
    if (!pair) rep.forEach(r => {
      if (r.type === 'candidate-pair' && r.state === 'succeeded' && (r.nominated || r.selected)) pair = r;
    });
    rep.forEach(r => {
      if ((r.kind || r.mediaType) !== 'video' || r.isRemote) return;
      if (r.type === 'outbound-rtp') out = r;
      if (r.type === 'inbound-rtp') inn = r;
    });
    const kbps = (key, r, field) => {
      if (!r) return null;
      const p = prev[key];
      prev[key] = { b: r[field], t: r.timestamp };
      return p && r.timestamp > p.t ? (r[field] - p.b) * 8 / (r.timestamp - p.t) : null;
    };
    const lc = pair && byId[pair.localCandidateId], rc = pair && byId[pair.remoteCandidateId];
    let route = null;
    if (lc && rc) {
      const types = [lc.candidateType, rc.candidateType];
      route = types.includes('relay') ? 'routeRelay' : types.every(x => x === 'host') ? 'routeHost' : 'routeSrflx';
    }
    const lost = inn ? inn.packetsLost : 0, got = inn ? inn.packetsReceived : 0;
    info = {
      route, proto: lc && lc.protocol,
      rtt: pair && pair.currentRoundTripTime != null ? pair.currentRoundTripTime * 1000 : null,
      out: out && { w: out.frameWidth, h: out.frameHeight, fps: out.framesPerSecond, kbps: kbps('out', out, 'bytesSent') },
      inn: inn && { w: inn.frameWidth, h: inn.frameHeight, fps: inn.framesPerSecond, kbps: kbps('in', inn, 'bytesReceived') },
      loss: inn && lost + got > 0 ? lost / (lost + got) * 100 : null
    };
    renderInfo();
  }

  function togglePanel(which) {
    const map = { dev: [$('devPanel'), $('devBtn')], info: [$('infoPanel'), $('infoBtn')] };
    Object.entries(map).forEach(([k, [panel, btn]]) => {
      const on = k === which && !panel.classList.contains('on');
      panel.classList.toggle('on', on);
      btn.setAttribute('aria-expanded', on);
    });
    clearInterval(statsTimer);
    if (which === 'info' && $('infoPanel').classList.contains('on')) { statsTimer = setInterval(pollStats, 1000); pollStats(); }
  }

  $('devBtn').onclick = () => togglePanel('dev');
  $('infoBtn').onclick = () => togglePanel('info');
  document.addEventListener('keydown', e => { if (e.key === 'Escape') togglePanel(null); });
  $('selCam').onchange = e => switchDevice('video', e.target.value);
  $('selMic').onchange = e => switchDevice('audio', e.target.value);
  $('selSpk').onchange = async e => {
    devErrKey = null;
    try { await $('remote').setSinkId(e.target.value); sinkId = e.target.value; }
    catch (_) { devErrKey = 'devErr'; }
    render();
  };
  if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) {
    navigator.mediaDevices.addEventListener('devicechange', loadDevices);
  }

  // ---------- Fullscreen and Picture-in-Picture ----------
  const remoteEl = $('remote');
  const fsElement = () => document.fullscreenElement || document.webkitFullscreenElement || null;
  const canFs = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled || 'webkitEnterFullscreen' in HTMLVideoElement.prototype);
  const canPip = !!(document.pictureInPictureEnabled && !remoteEl.disablePictureInPicture);
  if (!canFs) $('fsBtn').style.display = 'none';
  if (!canPip) $('pipBtn').style.display = 'none';

  function updateViewButtons() {
    const fsOn = !!fsElement();
    setLabeled($('fsBtn'), fsOn ? 'shrink' : 'expand', t(fsOn ? 'exitFullscreen' : 'fullscreen'));
    $('fsBtn').setAttribute('aria-pressed', fsOn);
    const pipOn = !!document.pictureInPictureElement;
    setLabeled($('pipBtn'), 'pip', t(pipOn ? 'pipExit' : 'pip'));
    $('pipBtn').setAttribute('aria-pressed', pipOn);
    // Picture-in-Picture needs a playing remote video.
    $('pipBtn').disabled = !pipOn && remoteEl.readyState === 0;
  }

  $('fsBtn').onclick = async () => {
    const el = $('call');
    try {
      if (fsElement()) await (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else if (el.requestFullscreen) await el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      else if (remoteEl.webkitEnterFullscreen) remoteEl.webkitEnterFullscreen(); // iPhone: native video player
    } catch (_) {}
  };
  $('pipBtn').onclick = async () => {
    try {
      if (document.pictureInPictureElement) await document.exitPictureInPicture();
      else await remoteEl.requestPictureInPicture();
    } catch (_) {}
  };
  ['fullscreenchange', 'webkitfullscreenchange'].forEach(ev => document.addEventListener(ev, updateViewButtons));
  ['loadedmetadata', 'emptied', 'enterpictureinpicture', 'leavepictureinpicture'].forEach(ev => remoteEl.addEventListener(ev, updateViewButtons));

  // Opened via a room link: prefill the code and wait for a click so the browser can ask for camera permission.
  const fromHash = clean(location.hash.slice(1));
  if (fromHash) $('code').value = fromHash;

  render();
})();
</script>
</body>
</html>
