<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P2P11</title>
<meta name="description" content="Direct 1-to-1 peer-to-peer video calls in the browser.">
<meta name="theme-color" content="#0e7c86">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="P2P11">
<style>
  :root {
    --bg: #e8edf1; --ink: #14212b; --muted: #5b6b78; --panel: #ffffff;
    --accent: #0e7c86; --accent-ink: #ffffff; --danger: #c2412d; --stage: #101a22;
    --line: #cfd8df;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1419; --ink: #e6edf2; --muted: #8fa1ae; --panel: #16212a; --line: #26343f; --stage: #05090c; --accent: #2bb3bf; --accent-ink: #04161a; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, input { font: inherit; color: inherit; }
  .lobby { min-height: 100%; display: grid; grid-template-rows: 1fr auto; place-items: center; padding: 24px; position: relative; }
  #roomPw { width: 100%; }
  #roomPw + .hint { margin: 6px 0 16px; }
  .invcard .err { color: #ff9b8a; margin: 8px 0 0; min-height: 1.2em; font-size: .9rem; }
  .invcard #invitePw { margin: 10px 0 0; }
  .btn.ghost { margin-top: 14px; background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .hint { margin: 14px 0 0; color: var(--muted); font-size: .88rem; }
  .foot { margin-top: 24px; font-size: .85rem; color: var(--muted); text-align: center; }
  .foot a { color: inherit; text-decoration: underline; text-underline-offset: 3px; }
  .foot a:hover { color: var(--ink); }
  .foot a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 28px; width: min(420px, 100%); }
  h1 { margin: 0 0 6px; font-size: 1.6rem; letter-spacing: -0.01em; }
  p.sub { margin: 0 0 22px; color: var(--muted); }
  .btn { border: 0; border-radius: 10px; padding: 12px 18px; cursor: pointer; background: var(--accent); color: var(--accent-ink); font-weight: 600; width: 100%; }
  .btn:focus-visible, .ctl:focus-visible, .lang:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .or { text-align: center; color: var(--muted); margin: 16px 0; font-size: .9rem; }
  .row { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: transparent; }
  .row .btn { width: auto; background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .err { color: var(--danger); margin: 14px 0 0; min-height: 1.4em; font-size: .92rem; }
  .lang { position: absolute; top: 16px; right: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: .9rem; }

  .call { display: none; position: fixed; inset: 0; background: var(--stage); }
  .call.on { display: block; }
  #remote { width: 100%; height: 100%; object-fit: contain; background: var(--stage); }
  #local { display: block; width: 100%; height: auto; max-height: 40vh; object-fit: contain; border-radius: 12px; border: 2px solid rgba(255,255,255,.25); background: #000; }
  .status { position: absolute; top: 16px; left: 16px; right: 16px; display: flex; gap: 10px; align-items: center; justify-content: space-between; color: #fff; }
  .pill { background: rgba(0,0,0,.55); padding: 8px 14px; border-radius: 999px; font-size: .92rem; }
  .pill button { background: none; border: 0; color: #fff; text-decoration: underline; cursor: pointer; padding: 0 0 0 8px; }
  .bar { position: absolute; left: 0; right: 0; bottom: 20px; display: flex; justify-content: center; gap: 12px; }
  .ctl { border: 0; border-radius: 999px; padding: 12px 20px; background: rgba(255,255,255,.14); color: #fff; cursor: pointer; font-weight: 600; }
  .ctl[aria-pressed="true"] { background: #fff; color: #111; }
  .ctl.hang { background: var(--danger); }
  .bar { flex-wrap: wrap; gap: 8px; padding: 0 12px; }
  .ctl { padding: 10px 16px; }
  .ctl[aria-expanded="true"] { background: #fff; color: #111; }
  .panel { display: none; position: absolute; left: 16px; bottom: 84px; z-index: 5; width: min(360px, calc(100% - 32px)); max-height: calc(100% - 160px); overflow: auto; background: rgba(16,26,34,.94); color: #fff; border: 1px solid rgba(255,255,255,.18); border-radius: 12px; padding: 16px; }
  .panel.on { display: block; }
  .panel h2 { margin: 0 0 12px; font-size: 1rem; }
  .panel label { display: block; margin-bottom: 12px; font-size: .88rem; color: #b9c6d0; }
  .panel select { display: block; width: 100%; margin-top: 4px; padding: 9px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,.25); background: #0b1217; color: #fff; font: inherit; }
  .panel select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .panel .err { color: #ff9b8a; margin: 0; min-height: 0; }
  .panel dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; font-size: .9rem; }
  .panel dt { color: #b9c6d0; }
  .panel dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  .panel p { margin: 0; color: #b9c6d0; font-size: .9rem; }
  .ctl { width: 48px; height: 48px; padding: 0; display: inline-grid; place-items: center; }
  .ctl svg { width: 22px; height: 22px; display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .pill button { display: inline-flex; vertical-align: middle; align-items: center; }
  .pill button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .call.mirror #local, .call.mirror #remote { transform: scaleX(-1); }
  .call.mirror.in-pip #remote { transform: none; }
  .call.mirror.remote-share #remote { transform: none; }
  .call.sharing #local { transform: none; }
  .status { flex-wrap: wrap; }
  #timer { font-variant-numeric: tabular-nums; }
  .panel label.check { display: flex; align-items: center; gap: 10px; color: #fff; }
  .panel input[type="checkbox"] { flex: none; width: 18px; height: 18px; margin: 0; padding: 0; accent-color: var(--accent); }
  .ctl { position: relative; }
  .badge { position: absolute; top: -2px; right: -2px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--danger); color: #fff; font-size: .72rem; line-height: 18px; font-weight: 700; text-align: center; }
  .msgs { display: flex; flex-direction: column; gap: 6px; max-height: min(32vh, 260px); overflow-y: auto; margin-bottom: 10px; }
  .msg { max-width: 85%; padding: 7px 11px; border-radius: 12px; font-size: .92rem; line-height: 1.35; overflow-wrap: anywhere; white-space: pre-wrap; }
  .msg.mine { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; }
  .msg.theirs { align-self: flex-start; background: rgba(255,255,255,.14); color: #fff; border-bottom-left-radius: 4px; }
  .msg.sys { align-self: center; background: none; color: #b9c6d0; font-size: .8rem; max-width: 100%; }
  .msg time { display: block; font-size: .7rem; opacity: .7; margin-top: 2px; }
  .chatrow { display: flex; gap: 8px; }
  .chatrow input { color: #fff; border-color: rgba(255,255,255,.25); }
  .chatrow input:disabled, .send:disabled { opacity: .45; cursor: not-allowed; }
  .send { flex: none; width: 44px; height: 44px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); cursor: pointer; display: grid; place-items: center; }
  .send svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .send:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  #mic::after { content: ''; position: absolute; left: 12px; right: 12px; bottom: 6px; height: 3px; border-radius: 2px; background: #4ade80; transform: scaleX(var(--lvl, 0)); transform-origin: left center; transition: transform .08s linear; }
  #mic[aria-pressed="true"]::after { display: none; }
  .call { --lw: min(28vw, 220px); --lb: 92px; } /* local video width and bottom offset, shared with the badges */
  .vu { position: absolute; z-index: 2; width: 28px; height: 28px; border-radius: 50%; background: #0e7c86; box-shadow: 0 0 0 2px rgba(255,255,255,.85); display: flex; align-items: center; justify-content: center; gap: 2px; opacity: 0; transform: scale(.8); transition: opacity .15s, transform .15s; pointer-events: none; }
  .vu.on { opacity: 1; transform: none; }
  .vu i { display: block; width: 3px; height: 4px; border-radius: 2px; background: #fff; transition: height .1s linear; }
  #vuRemote { left: 16px; bottom: var(--lb); }
  #vuLocal { left: 8px; bottom: 8px; }
  @media (prefers-reduced-motion: reduce) { #mic::after, .vu, .vu i { transition: none; } }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .hand { position: absolute; z-index: 2; width: 28px; height: 28px; border-radius: 50%; background: #f5b301; box-shadow: 0 0 0 2px rgba(255,255,255,.85); display: grid; place-items: center; font-size: 15px; line-height: 1; opacity: 0; transform: scale(.8); transition: opacity .15s, transform .15s; pointer-events: none; }
  .hand.on { opacity: 1; transform: none; }
  #handRemote { left: 50px; bottom: var(--lb); }
  #handLocal { left: 42px; bottom: 8px; }
  .badge.emo-dot { background: transparent; font-size: .95rem; line-height: 18px; min-width: 0; padding: 0; }
  .emojis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; }
  .emo { font-size: 1.5rem; line-height: 1.2; padding: 6px 0; border-radius: 10px; border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.08); cursor: pointer; }
  .emo:hover { background: rgba(255,255,255,.18); }
  .emo:focus-visible, .handbtn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .emo:disabled, .handbtn:disabled { opacity: .4; cursor: not-allowed; }
  .handbtn { width: 100%; padding: 10px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,.25); background: transparent; color: #fff; cursor: pointer; font-weight: 600; display: flex; gap: 8px; align-items: center; justify-content: center; }
  .handbtn[aria-pressed="true"] { background: #f5b301; border-color: #f5b301; color: #1a1300; }
  .fly { position: absolute; z-index: 3; bottom: var(--lb); font-size: 2rem; line-height: 1; pointer-events: none; animation: floatUp 2.4s ease-out forwards; }
  .fly.theirs { left: calc(80px + var(--off, 0px)); }
  .fly.mine { right: calc(var(--lw) + 32px + var(--off, 0px)); }
  @keyframes floatUp {
    0% { opacity: 0; transform: translate(var(--dx, 0), 0) scale(.6); }
    15% { opacity: 1; transform: translate(var(--dx, 0), -20px) scale(1); }
    100% { opacity: 0; transform: translate(var(--dx, 0), -50vh) scale(1); }
  }
  @media (prefers-reduced-motion: reduce) { .hand { transition: none; } }
  .badge.dot { min-width: 10px; width: 10px; height: 10px; padding: 0; top: 2px; right: 2px; background: #ef4444; box-shadow: 0 0 0 2px rgba(16,26,34,.9); }
  .invite { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; pointer-events: none; }
  .invite[hidden] { display: none; }
  .invcard { pointer-events: auto; width: min(420px, 100%); padding: 22px; text-align: center; color: #fff; background: rgba(16,26,34,.92); border: 1px solid rgba(255,255,255,.18); border-radius: 14px; }
  .invcard h2 { margin: 0 0 6px; font-size: 1.1rem; }
  .invcard p { margin: 0 0 14px; color: #b9c6d0; font-size: .9rem; }
  .invcard input { width: 100%; padding: 10px 12px; text-align: center; font-size: .9rem; color: #fff; text-overflow: ellipsis; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.06); }
  .invrow { display: flex; gap: 10px; margin-top: 14px; }
  .invbtn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,.25); background: transparent; color: #fff; font-weight: 600; cursor: pointer; }
  .invbtn.primary { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
  .invbtn:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .invbtn svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .flip { position: absolute; z-index: 2; right: 6px; bottom: 6px; width: 36px; height: 36px; border: 0; border-radius: 50%; padding: 0; display: grid; place-items: center; background: rgba(0,0,0,.55); color: #fff; cursor: pointer; }
  .flip[hidden] { display: none; }
  .flip.torch { bottom: 50px; }
  .flip[aria-pressed="true"] { background: #fff; color: #111; }
  .flip:disabled { opacity: .5; cursor: progress; }
  .flip:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .flip svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .call.sharing .flip { display: none; }
  .call.mirror.rear #local { transform: none; } /* the rear camera is never mirrored */
  .toast { position: absolute; z-index: 7; left: 50%; bottom: calc(var(--lb) + 16px); transform: translateX(-50%); max-width: calc(100% - 32px); padding: 8px 14px; border-radius: 999px; background: rgba(16,26,34,.94); color: #fff; font-size: .9rem; text-align: center; }
  .toast[hidden] { display: none; }
  .ytcard { position: absolute; z-index: 4; top: 80px; left: 16px; width: min(320px, calc(100% - 32px)); background: rgba(16,26,34,.94); border: 1px solid rgba(255,255,255,.18); border-radius: 12px; overflow: hidden; color: #fff; }
  .ytcard[hidden] { display: none; }
  .ythead { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 6px 6px 12px; font-size: .85rem; font-weight: 600; }
  .ythead button { display: grid; place-items: center; width: 32px; height: 32px; border: 0; border-radius: 50%; background: transparent; color: #fff; cursor: pointer; }
  .ythead button:hover { background: rgba(255,255,255,.14); }
  .ythead button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .ythead svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
  .ytbox { aspect-ratio: 16 / 9; min-height: 200px; background: #000; } /* YouTube requires a viewport of at least 200x200 */
  .ytbox iframe { display: block; width: 100%; height: 100%; border: 0; }
  .ytinvite { position: absolute; z-index: 6; top: 72px; left: 50%; transform: translateX(-50%); width: min(380px, calc(100% - 32px)); }
  .ytinvite[hidden] { display: none; }
  .ytinvite .invcard { padding: 16px; }
  .ytinvite p { color: #fff; font-size: .95rem; margin: 0; }
  .panel .invbtn { width: 100%; }
  .lbox { position: absolute; z-index: 2; right: 16px; bottom: var(--lb); width: var(--lw); touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
  .lbox.dragging, .ytcard.dragging .ythead { cursor: grabbing; }
  .lbox:focus-visible, .ythead:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .ythead { cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
  .rz { position: absolute; z-index: 3; width: 28px; height: 28px; cursor: nwse-resize; touch-action: none; }
  .rz svg { position: absolute; width: 16px; height: 16px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; }
  .rz-tl { top: 0; left: 0; background: rgba(0,0,0,.45); border-radius: 12px 0 10px 0; }
  .rz-tl svg { top: 4px; left: 4px; }
  .ytfoot { position: relative; height: 18px; }
  .rz-br { right: 0; bottom: 0; width: 28px; height: 18px; }
  .rz-br svg { right: 4px; bottom: 1px; opacity: .8; }
  .more-wrap { position: relative; }
  .menu { display: none; position: absolute; right: 0; bottom: calc(100% + 10px); z-index: 6; width: min(250px, 90vw); padding: 6px; flex-direction: column; gap: 2px; background: rgba(16,26,34,.96); border: 1px solid rgba(255,255,255,.18); border-radius: 12px; }
  .menu.on { display: flex; }
  .menu .ctl { display: flex; align-items: center; justify-content: flex-start; gap: 12px; width: 100%; height: auto; padding: 10px 12px; border-radius: 8px; background: transparent; color: #fff; font-weight: 500; font-size: .95rem; text-align: left; }
  .menu .ctl:hover { background: rgba(255,255,255,.12); }
  .menu .ctl[aria-pressed="true"], .menu .ctl[aria-expanded="true"] { background: rgba(255,255,255,.2); color: #fff; }
  .menu .ctl svg { flex: none; }
  .ctl:disabled { opacity: .4; cursor: not-allowed; }
  @media (max-width: 600px) { .call { --lw: 32vw; } }
  @media (max-width: 359px) { .call { --lb: 144px; } .panel { bottom: 144px; } }
  .panel .vcode { margin: 0 0 12px; color: #fff; font: 600 1.25rem/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .06em; text-align: center; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<main class="lobby" id="lobby">
  <button class="lang" id="lang" type="button" aria-label="Language / Ngôn ngữ"></button>
  <div class="card">
    <h1>P2P11</h1>
    <p class="sub" data-i18n="sub"></p>
    <input id="roomPw" type="password" autocomplete="new-password" maxlength="64" data-i18n-ph="pwPh" data-i18n-aria="pwPh">
    <p class="hint" data-i18n="pwHint"></p>
    <button class="btn" id="create" data-i18n="create"></button>
    <div class="or" data-i18n="or"></div>
    <div class="row">
      <input id="code" autocomplete="off" maxlength="32" data-i18n-ph="codePh" data-i18n-aria="codePh">
      <button class="btn" id="join" data-i18n="join"></button>
    </div>
    <p class="err" id="err" role="alert"></p>
    <button class="btn ghost" id="installBtn" hidden data-i18n="install"></button>
    <p class="hint" id="iosHint" hidden data-i18n="iosHint"></p>
  </div>
  <footer class="foot">
    <span data-i18n="footerOss"></span>
    <a href="https://github.com/dieudv/p2p11" target="_blank" rel="noopener noreferrer">github.com/dieudv/p2p11</a>
  </footer>
</main>

<section class="call mirror" id="call">
  <video id="remote" autoplay playsinline></video>
  <div class="invite" id="invite" hidden>
    <div class="invcard" role="region" aria-labelledby="inviteTitle">
      <h2 id="inviteTitle" data-i18n="inviteTitle"></h2>
      <p data-i18n="inviteSub"></p>
      <input id="inviteLink" readonly data-i18n-aria="inviteLinkLbl">
      <p id="invitePw" hidden data-i18n="invitePw"></p>
      <div class="invrow">
        <button class="invbtn primary" id="inviteShare" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg><span data-i18n="inviteShare"></span></button>
        <button class="invbtn" id="inviteCopy" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><span data-i18n="inviteCopy"></span></button>
      </div>
    </div>
  </div>
  <div class="invite" id="pwDialog" hidden>
    <div class="invcard" role="alertdialog" aria-labelledby="pwTitle">
      <h2 id="pwTitle" data-i18n="pwTitle"></h2>
      <input id="pwInput" type="password" autocomplete="off" maxlength="64" data-i18n-ph="pwEnter" data-i18n-aria="pwEnter">
      <p class="err" id="pwErr" role="alert"></p>
      <div class="invrow">
        <button class="invbtn primary" id="pwOk" type="button" data-i18n="join"></button>
        <button class="invbtn" id="pwCancel" type="button" data-i18n="pwCancel"></button>
      </div>
    </div>
  </div>
  <div class="ytcard" id="ytCard" hidden>
    <div class="ythead" id="ytHead" tabindex="0" role="group" data-i18n-aria="dragHintYt"><span data-i18n="ytTitle"></span><button id="ytClose" type="button" data-i18n-label="ytClose"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="ytbox" id="ytBox"><div id="ytFrame"></div></div>
    <div class="ytfoot"><span class="rz rz-br" id="ytGrip" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 12L12 20M20 4L4 20"/></svg></span></div>
  </div>
  <div class="ytinvite" id="ytInvite" hidden>
    <div class="invcard" role="alertdialog" aria-labelledby="ytInviteText">
      <p id="ytInviteText"></p>
      <div class="invrow">
        <button class="invbtn primary" id="ytJoin" type="button" data-i18n="ytJoin"></button>
        <button class="invbtn" id="ytDecline" type="button" data-i18n="ytDecline"></button>
      </div>
    </div>
  </div>
  <div class="lbox" id="localBox" tabindex="0" role="group" data-i18n-aria="dragHint">

  }

  let statusKey = null, statusRaw = '';
  const setStatus = (key, raw = '') => { statusKey = key; statusRaw = raw; renderStatus(); };
  const renderStatus = () => { $('status').textContent = statusKey ? (statusKey === 'error' ? t('error') + statusRaw : t(statusKey)) : ''; };
  let errKey = null;
  const showErr = key => { errKey = key; $('err').textContent = key ? t(key) : ''; };

  function render() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
    document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = t(el.dataset.i18nPh));
    document.querySelectorAll('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', t(el.dataset.i18nAria)));
    $('lang').textContent = t('switchTo');
    document.querySelectorAll('[data-i18n-label]').forEach(el => {
      const l = t(el.dataset.i18nLabel);
      el.setAttribute('aria-label', l);
      el.title = l;
    });

    const camOff = $('cam').getAttribute('aria-pressed') === 'true';

    setLabeled($('cam'), camOff ? 'camOff' : 'cam', t(camOff ? 'camOff' : 'camOn'));
    renderStatus();
    $('err').textContent = errKey ? t(errKey) : '';
    $('devErr').textContent = devErrKey ? t(devErrKey) : '';
    loadDevices();
    renderInfo();
    renderVerify();
    updateViewButtons();
    updateShareButton();
    updateQualityLabels();
  }

  $('lang').onclick = () => {
    lang = lang === 'vi' ? 'en' : 'vi';
    try { localStorage.setItem('lang', lang); } catch (_) {}
    render();
  };

  // ---------- Call logic ----------
  const PREFIX = 'p2p11-';
  // The browsers always try a direct peer-to-peer path first. Many networks cannot do that (4G/5G and many home
  // internet lines sit behind carrier-grade NAT, and some routers or firewalls block UDP). For those, ICE falls
  // back to the free public relay (TURN) that PeerJS itself provides. Calls through it stay end-to-end encrypted
  // (DTLS-SRTP): the relay only sees encrypted packets and IP addresses.
  // NOTE: passing `config` REPLACES PeerJS's built-in defaults, so the relay must be listed here explicitly.
  // Set USE_RELAY to false to forbid any relay: calls then only work when a direct path exists.
  const USE_RELAY = true;
  const ICE_SERVERS = [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' },
    { urls: 'stun:stun2.l.google.com:19302' },
    { urls: 'stun:stun3.l.google.com:19302' },
    { urls: 'stun:stun.cloudflare.com:3478' },
    { urls: 'stun:global.stun.twilio.com:3478' },
    {
      urls: 'turn:turn.jami.net:3478?transport=udp',
      username: 'ring',
      credential: 'ring'
    },
    {
      urls: 'turn:turn.jami.net:3478?transport=tcp',
      username: 'ring',
      credential: 'ring'
    },
  ];
  if (USE_RELAY) {
    ICE_SERVERS.push({ urls: ['turn:eu-0.turn.peerjs.com:3478', 'turn:us-0.turn.peerjs.com:3478'], username: 'peerjs', credential: 'peerjsp' });
  }
  const PEER_OPTS = { config: { iceServers: ICE_SERVERS, iceCandidatePoolSize: 2, sdpSemantics: 'unified-plan' } };

  let stream, peer, call, room;
  let guestId = null, guestConn = null; // host side: the one person allowed in
  let statsTimer = null, prev = {}, info = null, devErrKey = null, sinkId = '';
  let startedAt = null, timerId = null, audioCtx = null, soundOn = true;
  let sharing = false, sharingStream = null, remoteShare = false, gateConn = null;
  let isHost = false, hostReady = false; // the invite card is only for the room's host, while waiting
  let myPassword = '', roomKeyP = Promise.resolve(null), guestAuth = null, authNonce = '', gateDone = false; // room password
  let failCount = 0, lockUntil = 0, lockLevel = 0;
  const pending = new Map(); // host: connections that have not yet proved they know the password

  const alphabet = 'abcdefghjkmnpqrstuvwxyz23456789';
  const makeCode = () => Array.from(crypto.getRandomValues(new Uint8Array(12)), n => alphabet[n % alphabet.length]).join('');
  const clean = s => s.trim().toLowerCase().replace(/[^a-z0-9]/g, '');

  // ---------- Microphone processing (noise suppression, echo cancellation, auto gain) ----------
  const micFx = { noiseSuppression: true, echoCancellation: true, autoGainControl: true };
  try { const s = JSON.parse(localStorage.getItem('micfx') || '{}'); Object.keys(micFx).forEach(k => { if (typeof s[k] === 'boolean') micFx[k] = s[k]; }); } catch (_) {}
  const audioConstraints = () => ({ ...micFx });

  async function enter(code) {
    room = clean(code);
    if (!room) return showErr('needCode');
    showErr(null);
    myPassword = $('roomPw').value.slice(0, 64);
    if (myPassword && !(window.crypto && crypto.subtle)) return showErr('pwNoCrypto');
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 }, audio: audioConstraints() });
    } catch (e) {
      return showErr('noMedia');
    }
    location.hash = room;
    loadDevices();
    inCall = true;
    keepAwake();
    try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch (_) {}
    setLocalMeter();
    updateRear();
    $('local').srcObject = stream;
    $('roomName').textContent = room;
    $('lobby').style.display = 'none';
    $('call').classList.add('on');
    startAsHost();
  }

  // The first person into a room keeps its ID. Anyone else first asks permission over a data
  // channel: the host lets exactly one guest in and answers "full" to everyone after that.
  // With a room password the guest must also pass a challenge first (see "Room password" below).
  function startAsHost() {
    isHost = true;
    setStatus('creating');
    // Key derived from the password: null = no password, false = failed (nobody is let in).
    roomKeyP = myPassword
      ? deriveKey(myPassword, room).catch(() => { setStatus('pwNoCrypto'); try { peer.destroy(); } catch (_) {} return false; })
      : Promise.resolve(null);
    peer = new Peer(PREFIX + room, PEER_OPTS);
    peer.on('open', () => { hostReady = true; setStatus('waiting'); updateInvite(); });
    peer.on('connection', conn => {
      conn.on('data', d => {
        if (conn === guestConn) onCtl(d);
        else if (d && d.type === 'proof') handleProof(conn, d);
      });
      conn.on('open', async () => {
        const key = await roomKeyP;
        if (key === false) return;
        // Checked after the await, and acted on straight away, so two joiners at the same moment cannot both get in.
        if (guestId && guestId !== conn.peer) { refuse(conn, 'full'); return; }
        if (key === null) { admit(conn); return; }
        if (Date.now() < lockUntil) { refuse(conn, 'denied', { reason: 'locked' }); return; }
        if (pending.size >= 4) { refuse(conn, 'full'); return; }
        const nonce = randomB64(16);
        const timer = setTimeout(() => { try { conn.close(); } catch (_) {} }, 90000); // do not wait for ever
        pending.set(conn, { nonce, tries: 0, timer });

      });
      conn.on('close', () => {
        clearPending(conn);
        if (guestConn === conn) { guestId = null; guestConn = null; }
      });
    });

      // Only the admitted guest may call, and only once.
      if (c.peer !== guestId || (call && call.open)) { c.close(); return; }
      c.answer(outStream());
      bind(c);
    });
    peer.on('error', err => {
      if (err.type === 'unavailable-id') { peer.destroy(); startAsGuest(); }
      else if (err.type === 'webrtc') showToast(t('webrtc')); // one failed attempt: keep waiting for the next
      else fail(err);
    });
  }

  function startAsGuest() {
    isHost = false; hostReady = false; guestAuth = null; gateDone = false;
    setStatus('connecting');
    peer = new Peer(PEER_OPTS);
    peer.on('open', () => {
      const conn = peer.connect(PREFIX + room, { reliable: true });
      gateConn = conn;
      // The first step needs a working path between the two networks too, so say so if it takes too long.
      setTimeout(() => { if (!gateDone && !call && $('pwDialog').hidden) setStatus('connectSlow'); }, 20000);
      conn.on('data', d => onGate(conn, d));
      conn.on('close', () => { if (!call && !gateDone) { hidePwDialog(); setStatus('gateClosed'); } });
    });
    peer.on('error', err => fail(err));
  }

  function bind(c) {
    call = c; prev = {};
    setTimeout(() => { if (call === c && !startedAt) setStatus('connectSlow'); }, 20000);
    c.on('stream', s => { $('remote').srcObject = s; setStatus('connected'); startTimer(); setRemoteMeter(s); });
    c.on('close', () => { $('remote').srcObject = null; setStatus('left'); stopTimer(); stopShare(false); onCtl({ type: 'share', on: false }); setRemoteMeter(null); setHand(false, false); onCtl({ type: 'hand', on: false }); });
    c.on('error', fail);
  }

  function fail(err) {
    if (STR[lang][err.type]) setStatus(err.type);
    else setStatus('error', err.type || err.message);
  }

  function leave() {
    clearInterval(statsTimer);
    try { pipWin && pipWin.close(); } catch (_) {}
    sharingStream && sharingStream.getTracks().forEach(x => x.stop());
    inCall = false;
    startedAt = null;
    clearInterval(timerId);
    try { wakeLock && wakeLock.release(); } catch (_) {}
    try { call && call.close(); peer && peer.destroy(); } catch (_) {}
    stream && stream.getTracks().forEach(tr => tr.stop());
    history.replaceState(null, '', location.pathname);
    location.reload();
  }

  let camMemo = {}, camBusy = false, blackTrack = null;
  const camIsOff = () => $('cam').getAttribute('aria-pressed') === 'true';
  // Black placeholder video, so the sender keeps a track while the camera hardware is released.
  function getBlack() {
    if (!blackTrack || blackTrack.readyState === 'ended') {
      const c = document.createElement('canvas');
      c.width = 640; c.height = 360;
      c.getContext('2d').fillRect(0, 0, 640, 360);
      blackTrack = c.captureStream(5).getVideoTracks()[0];
    }
    return blackTrack;
  }
  // Stream handed to PeerJS: never without a video track, so the camera can be turned on later.
  const outStream = () => stream.getVideoTracks().length ? stream : new MediaStream([...stream.getAudioTracks(), getBlack()]);

  async function setCamera(on) {
    const pc = call && call.peerConnection;
    const sender = pc && pc.getSenders().find(x => x.track && x.track.kind === 'video');
    if (!on) {
      const old = stream.getVideoTracks()[0];
      if (old) {
        const s = old.getSettings();
        camMemo = { deviceId: s.deviceId, facing: s.facingMode };
        await setTorch(false);
        old.stop(); // releases the camera, the LED goes off
        stream.removeTrack(old);
      }
      if (sender && !sharing) { try { await sender.replaceTrack(getBlack()); } catch (_) {} }
      updateRear();
      return true;
    }
    const tries = [];
    if (camMemo.deviceId) tries.push({ deviceId: { exact: camMemo.deviceId } });
    if (camMemo.facing === 'user' || camMemo.facing === 'environment') tries.push({ facingMode: { ideal: camMemo.facing } });
    tries.push({});
    let ns = null;
    for (const c of tries) {
      try { ns = await navigator.mediaDevices.getUserMedia({ video: { ...c, width: 1280, height: 720 } }); break; } catch (_) {}
    }
    if (!ns) { showToast(t('noMedia')); return false; }
    const nt = ns.getVideoTracks()[0];
    stream.addTrack(nt);
    updateRear();
    if (sender && !sharing) { try { await sender.replaceTrack(nt); } catch (_) {} }
    applyQuality();
    if (!sharing) { $('local').srcObject = null; $('local').srcObject = stream; }
    loadDevices();

  }

  function toggle(btn, kind) {
    btn.addEventListener('click', async () => {
      const off = btn.getAttribute('aria-pressed') !== 'true';

        if (camBusy) return;
        camBusy = true;
        const ok = await setCamera(!off);
        camBusy = false;
        if (!ok) return;
      } else stream.getAudioTracks().forEach(tr => tr.enabled = !off);
      btn.setAttribute('aria-pressed', off);
      render();
    });
  }

  $('create').onclick = () => enter(makeCode());
  $('join').onclick = () => enter($('code').value);
  $('code').addEventListener('keydown', e => { if (e.key === 'Enter') enter($('code').value); });
  $('hang').onclick = leave;
  toggle($('mic'), 'audio');
  toggle($('cam'), 'video');

  // ---------- Devices ----------
  function fillSelect(sel, list, label, current) {
    sel.textContent = '';
    list.forEach((d, i) => {
      const o = document.createElement('option');
      o.value = d.deviceId;
      o.textContent = d.label || (d.deviceId === 'default' ? t('devDefault') : label + ' ' + (i + 1));
      sel.appendChild(o);
    });
    if (current && list.some(d => d.deviceId === current)) sel.value = current;
  }

  async function loadDevices() {
    if (!stream || !navigator.mediaDevices.enumerateDevices) return;
    let list = [];
    try { list = await navigator.mediaDevices.enumerateDevices(); } catch (_) { return; }
    const cur = kind => { const tr = stream.getTracks().find(x => x.kind === kind); return tr && tr.getSettings().deviceId; };
    fillSelect($('selCam'), list.filter(d => d.kind === 'videoinput'), 'Camera', cur('video'));
    $('flipBtn').hidden = list.filter(d => d.kind === 'videoinput').length < 2;
    fillSelect($('selMic'), list.filter(d => d.kind === 'audioinput'), 'Mic', cur('audio'));
    const canSink = 'setSinkId' in HTMLMediaElement.prototype;
    $('spkRow').style.display = canSink ? '' : 'none';
    if (canSink) fillSelect($('selSpk'), list.filter(d => d.kind === 'audiooutput'), 'Speaker', sinkId);
  }

  async function switchDevice(kind, id, facing) {
    devErrKey = null;
    const old = stream.getTracks().find(x => x.kind === kind);
    const oldId = old && old.getSettings().deviceId;
    const wasEnabled = old ? old.enabled : true;
    // Stop the old track first: many phones cannot open two cameras at once.
    if (old) { old.stop(); stream.removeTrack(old); }

    const open = arg => navigator.mediaDevices.getUserMedia(kind === 'video'
      ? { video: { ...(typeof arg === 'string' ? { deviceId: { exact: arg } } : { facingMode: { exact: arg.facing } }), width: 1280, height: 720 } }
      : { audio: { deviceId: { exact: arg }, ...audioConstraints() } });

    try { ns = await open(facing ? { facing } : id); }
    catch (_) {
      devErrKey = 'devErr';
      if (oldId) { try { ns = await open(oldId); } catch (_) {} }
    }
    if (ns) {
      const nt = ns.getTracks()[0];
      nt.enabled = wasEnabled;
      stream.addTrack(nt);
      if (kind === 'audio') setLocalMeter(); // the analyser must follow the new microphone
      if (kind === 'video') { updateRear(); applyQuality(); }
      const pc = call && call.peerConnection;
      const sender = pc && pc.getSenders().find(x => x.track && x.track.kind === kind);

      $('local').srcObject = sharingStream || stream;
    }

  }

  // ---------- Outgoing video quality ----------
  // Caps what YOU send (resolution, bitrate, frame rate) through the sender's encoding parameters.
  // It saves data and CPU on slow links and does not restart the connection. The Info panel shows the effect.
  const QUALITY = {
    auto:   { label: 'qAuto' },
    high:   { label: 'qHigh',   h: 720, kbps: 2500, fps: 30 },
    medium: { label: 'qMedium', h: 480, kbps: 1000, fps: 30 },
    low:    { label: 'qLow',    h: 360, kbps: 500,  fps: 24 },
    saver:  { label: 'qSaver',  h: 240, kbps: 200,  fps: 15 }

  try { const q = localStorage.getItem('quality'); if (QUALITY[q]) quality = q; } catch (_) {}

  Object.keys(QUALITY).forEach(k => {
    const o = document.createElement('option');
    o.value = k;
    $('selQuality').append(o);
  });
  $('selQuality').value = quality;
  function updateQualityLabels() {
    for (const o of $('selQuality').options) o.textContent = t(QUALITY[o.value].label);
  }

  async function applyQuality(retry = 0) {
    const pc = call && call.peerConnection;
    const sender = pc && pc.getSenders().find(x => x.track && x.track.kind === 'video');
    if (!sender) return;
    const params = sender.getParameters();
    if (!params.encodings || !params.encodings.length) { // not negotiated yet, try again shortly
      if (retry < 6) setTimeout(() => applyQuality(retry + 1), 500);
      return;
    }
    const enc = params.encodings[0], q = QUALITY[quality];

      const st = sender.track.getSettings();
      const side = Math.min(st.width || q.h, st.height || q.h); // short side, so portrait phones work too
      enc.scaleResolutionDownBy = Math.max(1, side / q.h);

      enc.maxFramerate = q.fps;

      delete enc.maxBitrate;
      delete enc.maxFramerate;

  }
  $('selQuality').onchange = e => {
    quality = e.target.value;
    try { localStorage.setItem('quality', quality); } catch (_) {}
    applyQuality();
  };

  // ---------- Flashlight (torch) of the rear camera ----------
  // Only where the browser reports the capability (mostly Chrome/Edge on Android with a rear camera).
  // iPhones/iPads and desktops do not expose it, so the button simply never appears there.
  let torchTrack = null, torchOn = false;
  function updateTorch() {
    const tr = stream && stream.getVideoTracks()[0];
    if (tr !== torchTrack) { torchTrack = tr || null; torchOn = false; } // a new camera track always starts with the light off
    let caps = {};
    try { caps = (tr && tr.getCapabilities && tr.getCapabilities()) || {}; } catch (_) {}
    const facing = tr && tr.getSettings().facingMode;
    $('torchBtn').hidden = !(caps.torch && facing !== 'user');
    const label = t(torchOn ? 'torchOff' : 'torchOn');
    $('torchBtn').setAttribute('aria-pressed', torchOn);
    $('torchBtn').setAttribute('aria-label', label);
    $('torchBtn').title = label;
  }
  async function setTorch(on) {
    const tr = torchTrack;
    if (!tr || (!on && !torchOn)) return;
    try {
      await tr.applyConstraints({ advanced: [{ torch: !!on }] });
      torchOn = !!on;
    } catch (_) {

      if (on) showToast(t('torchFail'));
    }
    updateTorch();
  }
  $('torchBtn').onclick = () => setTorch(!torchOn);

  // ---------- Quick front/back camera switch (button on your own video) ----------
  let toastTimer = null, flipping = false;
  function showToast(msg) {
    clearTimeout(toastTimer);
    $('toast').textContent = msg;
    $('toast').hidden = false;
    toastTimer = setTimeout(() => { $('toast').hidden = true; }, 2600);
  }
  function updateRear() {
    const tr = stream && stream.getVideoTracks()[0];
    const f = tr && tr.getSettings().facingMode;
    $('call').classList.toggle('rear', f === 'environment');
    updateTorch();
  }
  async function flipCamera() {

    let ok = false;
    try {
      const cur = stream.getVideoTracks()[0];
      const facing = cur && cur.getSettings().facingMode; // 'user' | 'environment' on phones, often missing on desktop

    $('flipBtn').disabled = false;
    if (!ok) showToast(t('flipFail'));
  }
  $('flipBtn').onclick = flipCamera;

  // ---------- Connection info ----------
  const fmtVideo = v => {
    if (!v) return '—';
    const parts = [];
    if (v.w && v.h) parts.push(v.w + '×' + v.h);
    if (v.fps) parts.push(Math.round(v.fps) + ' fps');
    if (v.kbps != null) parts.push(Math.round(v.kbps) + ' kbps');
    return parts.join(', ') || '—';
  };

  function renderInfo() {
    const body = $('infoBody');
    body.textContent = '';
    if (!info) { const p = document.createElement('p'); p.textContent = t('noConn'); body.appendChild(p); return; }
    const rows = [
      ['rRoute', info.route ? t(info.route) + (info.proto ? ' (' + info.proto.toUpperCase() + ')' : '') : '—'],
      ['rRtt', info.rtt != null ? Math.round(info.rtt) + ' ms' : '—'],
      ['rOut', fmtVideo(info.out)],
      ['rIn', fmtVideo(info.inn)],
      ['rLoss', info.loss != null ? info.loss.toFixed(1) + ' %' : '—']
    ];
    const dl = document.createElement('dl');
    rows.forEach(([k, v]) => {
      const dt = document.createElement('dt'); dt.textContent = t(k);
      const dd = document.createElement('dd'); dd.textContent = v;
      dl.append(dt, dd);
    });
    body.appendChild(dl);
  }

  async function pollStats() {
    const pc = call && call.peerConnection;
    if (!pc || pc.connectionState === 'closed') { info = null; renderInfo(); return; }
    let rep;
    try { rep = await pc.getStats(); } catch (_) { return; }
    const byId = {};
    rep.forEach(r => { byId[r.id] = r; });
    let pair = null, out = null, inn = null;
    rep.forEach(r => {
      if (r.type === 'transport' && r.selectedCandidatePairId && byId[r.selectedCandidatePairId]) pair = byId[r.selectedCandidatePairId];
    });
    if (!pair) rep.forEach(r => {
      if (r.type === 'candidate-pair' && r.state === 'succeeded' && (r.nominated || r.selected)) pair = r;
    });
    rep.forEach(r => {
      if ((r.kind || r.mediaType) !== 'video' || r.isRemote) return;
      if (r.type === 'outbound-rtp') out = r;
      if (r.type === 'inbound-rtp') inn = r;
    });
    const kbps = (key, r, field) => {
      if (!r) return null;
      const p = prev[key];
      prev[key] = { b: r[field], t: r.timestamp };
      return p && r.timestamp > p.t ? (r[field] - p.b) * 8 / (r.timestamp - p.t) : null;
    };
    const lc = pair && byId[pair.localCandidateId], rc = pair && byId[pair.remoteCandidateId];
    let route = null;
    if (lc && rc) {
      const types = [lc.candidateType, rc.candidateType];
      route = types.includes('relay') ? 'routeRelay' : types.every(x => x === 'host') ? 'routeHost' : 'routeSrflx';
    }
    const lost = inn ? inn.packetsLost : 0, got = inn ? inn.packetsReceived : 0;
    info = {
      route, proto: lc && lc.protocol,
      rtt: pair && pair.currentRoundTripTime != null ? pair.currentRoundTripTime * 1000 : null,

  let ytPlayer = null, ytReady = false, ytId = null, ytActive = false, ytLeader = false;

  function parseYouTubeId(input) {

    if (YT_ID.test(v)) return v;
    let u;
    try { u = new URL(v.includes('://') ? v : 'https://' + v); } catch (_) { return null; }
    const host = u.hostname.replace(/^(www|m|music)\./, '');

  function loadYouTubeApi() {

      window.onYouTubeIframeAPIReady = resolve;
      const sc = document.createElement('script');
      sc.src = 'https://www.youtube.com/iframe_api';
      sc.onerror = () => { ytApi = null; reject(new Error('load')); };
      document.head.append(sc);
      setTimeout(() => { if (!(window.YT && window.YT.Player)) { ytApi = null; reject(new Error('timeout')); } }, 10000);
    });

  async function startYt(id, at, playing) {

    } else if (d.a === 'stop') {

  }

  function goYt() {
    const id = parseYouTubeId($('ytUrl').value);

    $('ytUrl').value = '';

  // ---------- Drag and drop: your own video and the Watch together window ----------
  // Pointer events cover mouse, touch and pen. The arrow keys move the focused box too, and a
  // double-click puts it back where it started. Positions are kept inside the call area.
  const draggables = [];

    const area = () => $('call').getBoundingClientRect();
    function place(left, top) {
      const cr = area(), r = box.getBoundingClientRect();
      left = Math.min(Math.max(0, left), Math.max(0, cr.width - r.width));
      top = Math.min(Math.max(0, top), Math.max(0, cr.height - r.height));
      Object.assign(box.style, { left: left + 'px', top: top + 'px', right: 'auto', bottom: 'auto' });

  // limits(callWidth) returns [min, max] width in px.
  function makeResizable(box, grip, corner, limits, keyTarget) {

    const snapshot = () => {
      const r = box.getBoundingClientRect(), cr = area();
      return { left: r.left - cr.left, top: r.top - cr.top, right: r.right - cr.left, bottom: r.bottom - cr.top, width: r.width, height: r.height, cw: cr.width, ch: cr.height };
    };

      const ratio = st.height / st.width;
      const [lo, hi0] = limits(st.cw);
      const hi = Math.min(hi0, corner === 'tl' ? Math.min(st.right, st.bottom / ratio) : Math.min(st.cw - st.left, (st.ch - st.top) / ratio));

  // ---------- Room password ----------
  // The password itself is never sent. The host gives the guest a random challenge (nonce), the guest answers
  // with an HMAC of it computed with a key stretched from the password (PBKDF2), and the host answers with a
  // second HMAC so the guest knows the room is the real one. Everything in this block runs in the browser.
  const enc = new TextEncoder();
  const B64 = /^[A-Za-z0-9+/=]{1,200}$/;
  const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const unb64 = str => Uint8Array.from(atob(str), ch => ch.charCodeAt(0));
  const randomB64 = n => b64(crypto.getRandomValues(new Uint8Array(n)));
  const hmac = (key, text) => crypto.subtle.sign('HMAC', key, enc.encode(text));

  async function deriveKey(password, roomCode) {
    const base = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: enc.encode('p2p11|' + roomCode), iterations: 150000, hash: 'SHA-256' },
      base, { name: 'HMAC', hash: 'SHA-256', length: 256 }, false, ['sign', 'verify']);
  }

  // ----- host side -----
  function clearPending(conn) {
    const p = pending.get(conn);
    if (p) { clearTimeout(p.timer); pending.delete(conn); }
  }
  function refuse(conn, type, extra) {
    try { conn.send({ type, ...extra }); } catch (_) {}
    clearPending(conn);
    setTimeout(() => { try { conn.close(); } catch (_) {} }, 600);
  }
  function admit(conn, hp) {
    guestId = conn.peer; guestConn = conn;
    conn.send(hp ? { type: 'welcome', hp } : { type: 'welcome' });
  }
  async function handleProof(conn, d) {
    const p = pending.get(conn);
    const key = await roomKeyP;
    if (!p || !key) return;
    if (Date.now() < lockUntil) { refuse(conn, 'denied', { reason: 'locked' }); return; }
    let ok = false;
    if (typeof d.cn === 'string' && typeof d.proof === 'string' && B64.test(d.cn) && B64.test(d.proof)) {
      try { ok = await crypto.subtle.verify('HMAC', key, unb64(d.proof), enc.encode('c|' + p.nonce + '|' + d.cn)); } catch (_) {}
    }
    if (!pending.has(conn)) return; // the connection went away while we were checking
    if (ok) {
      clearPending(conn);
      failCount = 0; lockLevel = 0;
      if (guestId && guestId !== conn.peer) { refuse(conn, 'full'); return; }
      admit(conn, b64(await hmac(key, 'h|' + p.nonce + '|' + d.cn)));
      return;
    }
    // Wrong password: 3 tries per connection, and 5 failures in total lock the room for 30 s, doubling each time (max 10 min).
    p.tries++; failCount++;
    if (failCount >= 5) { lockLevel++; lockUntil = Date.now() + Math.min(600000, 30000 * 2 ** (lockLevel - 1)); failCount = 0; }
    if (p.tries >= 3 || Date.now() < lockUntil) { refuse(conn, 'denied', { reason: 'locked' }); return; }
    p.nonce = randomB64(16); // a new challenge for every attempt, so an old answer is useless
    conn.send({ type: 'denied', reason: 'password', nonce: p.nonce });
  }

  // ----- guest side -----
  function hidePwDialog() { $('pwDialog').hidden = true; }
  function showPwDialog(errKey) {
    myPassword = ''; // what was typed (if anything) did not work
    $('pwErr').textContent = errKey ? t(errKey) : '';
    $('pwInput').value = '';
    $('pwDialog').hidden = false;
    setStatus('pwWaiting');
    setTimeout(() => $('pwInput').focus(), 0);
    announce(t('pwTitle'));
  }
  async function sendProof(conn, password) {
    try {
      const key = await deriveKey(password, room);
      const cn = randomB64(16);
      const proof = b64(await hmac(key, 'c|' + authNonce + '|' + cn));
      guestAuth = { key, cn, nonce: authNonce };
      conn.send({ type: 'proof', cn, proof });
      setStatus('connecting');
    } catch (_) { setStatus('pwNoCrypto'); }
  }
  async function onGate(conn, d) {
    if (!d) return;

      if (typeof d.nonce !== 'string' || !B64.test(d.nonce)) return;
      authNonce = d.nonce;
      if (d.type === 'auth' && myPassword) await sendProof(conn, myPassword);
      else showPwDialog(d.type === 'denied' ? 'pwWrong' : null);
    } else if (d.type === 'denied') { // locked out
      gateDone = true; hidePwDialog(); setStatus('pwLocked');
      try { peer.destroy(); } catch (_) {}
    } else if (d.type === 'welcome' && !call) {

        try { ok = typeof d.hp === 'string' && B64.test(d.hp) && await crypto.subtle.verify('HMAC', guestAuth.key, unb64(d.hp), enc.encode('h|' + guestAuth.nonce + '|' + guestAuth.cn)); } catch (_) {}
        if (!ok) { gateDone = true; setStatus('pwFake'); try { peer.destroy(); } catch (_) {} return; }
      } else if (myPassword) { // you typed a password, so you expect a protected room, but this one is open
        gateDone = true; setStatus('pwUnexpected'); try { peer.destroy(); } catch (_) {}
        return;
      }
      gateDone = true; hidePwDialog();
      bind(peer.call(PREFIX + room, outStream()));
    } else if (d.type === 'full') {
      gateDone = true; setStatus('full');
      try { peer.destroy(); } catch (_) {}
    } else onCtl(d);
  }
  async function submitPw() {

  }

  $('pwInput').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); submitPw(); } });

  // ---------- Safety verification code ----------
  // Both sides hash the two DTLS certificate fingerprints (from the SDP, sorted so the order is the same
  // on both) into 20 digits. If someone swapped a fingerprint on the signaling server, the codes differ.
  async function safetyCode() {
    const pc = call && call.peerConnection;
    if (!pc || !pc.localDescription || !pc.remoteDescription || !(window.crypto && crypto.subtle)) return null;
    const fp = d => { const m = /a=fingerprint:sha-256 ([0-9a-f:]+)/i.exec(d.sdp || ''); return m && m[1].toLowerCase(); };
    const a = fp(pc.localDescription), b = fp(pc.remoteDescription);

  };

  // Short two-note chime made with Web Audio, so no audio files are needed.
  function playTone(freqs) {
    if (!soundOn || !audioCtx) return;

      if (audioCtx.state === 'suspended') audioCtx.resume();
      const t0 = audioCtx.currentTime;
      freqs.forEach((f, i) => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain(), st = t0 + i * 0.14;
        o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, st);
        g.gain.exponentialRampToValueAtTime(0.18, st + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, st + 0.22);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(st); o.stop(st + 0.25);

  // ---------- Keep the screen awake during a call (Screen Wake Lock) ----------
  // The browser drops the lock whenever the tab is hidden, so request it again when the tab returns.
  let wakeLock = null, inCall = false;
  async function keepAwake() {

      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } catch (_) { wakeLock = null; } // denied, e.g. low battery mode
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') keepAwake();
  });

  // Opened via a room link: prefill the code and wait for a click so the browser can ask for camera permission.
  const fromHash = clean(location.hash.slice(1));
  if (fromHash) $('code').value = fromHash;

  render();
})();
</script>
</body>
